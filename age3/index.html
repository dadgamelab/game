<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3さいのゲーム - とうちゃんのゲームラボ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">

  <style>
    * {
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: 'Zen Maru Gothic', sans-serif;
      touch-action: manipulation;
      background-color: #FFFDF7;
    }

    /* ぷるぷるアニメーション */
    @keyframes wobble {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-3deg) scale(1.02); }
      75% { transform: rotate(3deg) scale(1.02); }
    }
    .animate-wobble {
      animation: wobble 2.4s infinite ease-in-out;
    }

    /* ふわっと浮き上がるアニメーション */
    @keyframes cardFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    .hover-float:hover {
      animation: cardFloat 1.2s ease-in-out infinite;
    }
  </style>
</head>

<body class="min-h-screen flex flex-col items-center justify-start text-gray-800 antialiased p-4 sm:p-6 select-none overflow-x-hidden">

  <!-- メインコンテナ -->
  <main class="w-full max-w-sm sm:max-w-md flex flex-col items-start py-2">

    <!-- トップへもどるボタン -->
    <button onclick="handleBackToTop()" class="px-4 py-2 bg-white rounded-full text-gray-700 text-sm font-bold shadow-md hover:bg-gray-50 active:scale-95 transition flex items-center gap-1.5 border border-gray-100 mb-5">
      <span>⬅</span>
      <span>トップへもどる</span>
    </button>

    <!-- タイトル見出し部（添付画像の車アイコン＆ブルー文字） -->
    <div class="flex items-center gap-2 mb-1">
      <span class="text-3xl animate-bounce">🚗</span>
      <h1 class="text-2xl sm:text-3xl font-black text-[#0284C7] tracking-tight">3さいのゲーム</h1>
    </div>
    <p class="text-gray-500 font-bold text-sm mb-6 pl-0.5">すきな あそびを えらんでね！</p>

    <!-- ゲーム選択カードリスト -->
    <div class="w-full flex flex-col gap-4">

      <!-- 1. どれかな？クイズ (game1.html) -->
      <button onclick="openGame('dorekana', 'game1.html')" class="w-full text-left p-4 rounded-3xl bg-white border-2 border-sky-200 hover:border-sky-300 shadow-md hover:shadow-lg active:scale-98 transition flex items-center gap-4 group hover-float">
        <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-rose-100 to-amber-100 flex items-center justify-center text-3xl shadow-inner border border-rose-200/60 shrink-0">
          🍎
        </div>
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-1.5 flex-wrap">
            <h2 class="text-lg font-black text-gray-800 group-hover:text-sky-600 transition truncate">どれかな？クイズ</h2>
            <span class="bg-sky-100 text-sky-700 text-[10px] px-2 py-0.5 rounded-full font-black">にんき</span>
          </div>
          <p class="text-xs text-gray-500 font-medium mt-1">おなじ えを みつけて タッチしよう！</p>
        </div>
        <div class="text-sky-400 text-xl font-bold pr-1 group-hover:translate-x-1 transition-transform shrink-0">➔</div>
      </button>

      <!-- 2. なかまはずれさがし (game2.html) -->
      <button onclick="openGame('nakamahazure', 'game2.html')" class="w-full text-left p-4 rounded-3xl bg-white border-2 border-emerald-200 hover:border-emerald-300 shadow-md hover:shadow-lg active:scale-98 transition flex items-center gap-4 group hover-float">
        <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-emerald-100 to-sky-100 flex items-center justify-center text-3xl shadow-inner border border-emerald-200/60 shrink-0">
          🧩
        </div>
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-1.5 flex-wrap">
            <h2 class="text-lg font-black text-gray-800 group-hover:text-emerald-600 transition truncate">なかまはずれさがし</h2>
            <span class="bg-emerald-100 text-emerald-700 text-[10px] px-2 py-0.5 rounded-full font-black">おすすめ</span>
          </div>
          <p class="text-xs text-gray-500 font-medium mt-1">ちがうものを 1つ みつけよう！</p>
        </div>
        <div class="text-emerald-400 text-xl font-bold pr-1 group-hover:translate-x-1 transition-transform shrink-0">➔</div>
      </button>

      <!-- 3. どっちがおおきい？ (game3.html) -->
      <button onclick="openGame('ookisa', 'game3.html')" class="w-full text-left p-4 rounded-3xl bg-white border-2 border-amber-200 hover:border-amber-300 shadow-md hover:shadow-lg active:scale-98 transition flex items-center gap-4 group hover-float">
        <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-amber-100 to-yellow-100 flex items-center justify-center text-3xl shadow-inner border border-amber-200/60 shrink-0">
          🐘
        </div>
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-1.5 flex-wrap">
            <h2 class="text-lg font-black text-gray-800 group-hover:text-amber-600 transition truncate">どっちがおおきい？</h2>
            <span class="bg-amber-100 text-amber-700 text-[10px] px-2 py-0.5 rounded-full font-black">あそべるよ</span>
          </div>
          <p class="text-xs text-gray-500 font-medium mt-1">おおきいほうを くらべて えらぼう！</p>
        </div>
        <div class="text-amber-400 text-xl font-bold pr-1 group-hover:translate-x-1 transition-transform shrink-0">➔</div>
      </button>

      <!-- 4. かげあわせ (game4.html) -->
      <button onclick="openGame('kageawase', 'game4.html')" class="w-full text-left p-4 rounded-3xl bg-white border-2 border-indigo-200 hover:border-indigo-300 shadow-md hover:shadow-lg active:scale-98 transition flex items-center gap-4 group hover-float">
        <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-indigo-100 to-sky-100 flex items-center justify-center text-3xl shadow-inner border border-indigo-200/60 shrink-0">
          👥
        </div>
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-1.5 flex-wrap">
            <h2 class="text-lg font-black text-gray-800 group-hover:text-indigo-600 transition truncate">かげあわせ</h2>
            <span class="bg-indigo-100 text-indigo-700 text-[10px] px-2 py-0.5 rounded-full font-black">たのしい</span>
          </div>
          <p class="text-xs text-gray-500 font-medium mt-1">くろい かげの え を あてよう！</p>
        </div>
        <div class="text-indigo-400 text-xl font-bold pr-1 group-hover:translate-x-1 transition-transform shrink-0">➔</div>
      </button>

    </div>

    <!-- おうちの方向け安心インフォメーション -->
    <div class="w-full mt-8 p-4 rounded-2xl bg-sky-50/80 border border-sky-200/70 text-center">
      <p class="text-xs text-sky-800 font-bold flex items-center justify-center gap-1">
        <span>🔒</span>
        <span>とうちゃんのゲームラボ 🐣 完全無料・広告なし</span>
      </p>
    </div>

  </main>

  <script>
    // Web Audio APIによる軽快なタップ音
    const SoundEffects = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      },
      playTap() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(460, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.08);

        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.1);
      }
    };

    // トップへもどる処理
    function handleBackToTop() {
      SoundEffects.playTap();
      setTimeout(() => {
        if (window.history.length > 1) {
          window.history.back();
        } else {
          window.location.href = './index.html';
        }
      }, 100);
    }

    // 各ゲームへの遷移処理
    function openGame(gameType, targetFile) {
      SoundEffects.playTap();
      setTimeout(() => {
        window.location.href = targetFile;
      }, 120);
    }

    // 初回操作時にオーディオ解放
    window.addEventListener('DOMContentLoaded', () => {
      const unlockAudio = () => {
        SoundEffects.init();
        document.removeEventListener('pointerdown', unlockAudio);
      };
      document.addEventListener('pointerdown', unlockAudio);
    });
  </script>
</body>
</html>
