<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>うんこゲーム - とうちゃんのゲームラボ</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: radial-gradient(circle at 50% 15%, #fffdf0 0%, #fef8eb 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 30px;
    }
    header {
      width: 100%;
      max-width: 380px;
      margin-bottom: 24px;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      text-decoration: none;
      background: #fff;
      color: #666;
      font-size: 0.85rem;
      padding: 6px 14px;
      border-radius: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      margin-bottom: 14px;
      font-weight: bold;
      border: 1px solid #f1e4d3;
      transition: transform 0.1s ease;
    }
    .back-btn:active {
      transform: scale(0.96);
    }
    h1 {
      font-size: 1.6rem;
      color: #d97706;
      font-weight: 900;
      letter-spacing: 0.03em;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .title-icon {
      display: inline-block;
      animation: wiggle-poop 2.2s ease-in-out infinite;
    }
    @keyframes wiggle-poop {
      0%, 100% { transform: rotate(0deg) scale(1); }
      25% { transform: rotate(-8deg) scale(1.08); }
      75% { transform: rotate(8deg) scale(1.08); }
    }
    p.lead {
      font-size: 0.88rem;
      color: #8c7355;
      margin-top: 6px;
      font-weight: 600;
    }
    .game-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      max-width: 380px;
    }
    .game-card {
      display: flex;
      align-items: center;
      background: #fff;
      text-decoration: none;
      padding: 16px;
      border-radius: 24px;
      box-shadow: 0 6px 16px rgba(180, 115, 25, 0.08);
      border: 2px solid transparent;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .game-card:active {
      transform: scale(0.96);
    }
    .card-buster {
      border-color: #bae6fd;
      box-shadow: 0 6px 16px rgba(56, 189, 248, 0.22);
    }
    .card-dash {
      border-color: #fde68a;
      box-shadow: 0 6px 16px rgba(245, 158, 11, 0.22);
    }
    .game-icon {
      font-size: 2.4rem;
      margin-right: 14px;
      width: 60px;
      height: 60px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.04);
    }
    .icon-buster { background: #e0f2fe; }
    .icon-dash   { background: #fef3c7; }

    .game-info {
      flex: 1;
    }
    .game-info h2 {
      font-size: 1.15rem;
      color: #33271d;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .game-info p {
      font-size: 0.82rem;
      color: #786452;
      margin-top: 4px;
      line-height: 1.4;
      font-weight: 500;
    }
    .badge {
      font-size: 0.7rem;
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: bold;
      color: #fff;
      flex-shrink: 0;
      margin-left: 6px;
    }
    .badge-fun { background: #0284c7; }
    .badge-pop { background: #ea580c; }

    .arrow {
      color: #cbd5e1;
      font-size: 1.2rem;
      font-weight: 900;
      margin-left: 6px;
    }
  </style>
</head>
<body>

  <header>
    <a href="../" class="back-btn">⬅ トップへもどる</a>
    <h1>
      <span class="title-icon">💩</span> うんこゲーム
    </h1>
    <p class="lead">だいすきな うんこの あそびを えらんでね！</p>
  </header>

  <main class="game-list">

    <!-- 1. トイレット・バスターズ！ (game1.html) -->
    <a href="game1.html" class="game-card card-buster">
      <div class="game-icon icon-buster">🚽</div>
      <div class="game-info">
        <h2>トイレット・バスターズ！ <span class="badge badge-fun">爽快シューティング</span></h2>
        <p>水鉄砲で落ちてくるうんこを撃ち落とせ！</p>
      </div>
      <div class="arrow">›</div>
    </a>

    <!-- 2. トイレット・ダッシュ！ (game2.html) -->
    <a href="game2.html" class="game-card card-dash">
      <div class="game-icon icon-dash">💩</div>
      <div class="game-info">
        <h2>トイレット・ダッシュ！ <span class="badge badge-pop">アクション</span></h2>
        <p>うんこをよけてペーパーを集め、トイレへ猛ダッシュ！</p>
      </div>
      <div class="arrow">›</div>
    </a>

  </main>

</body>
</html>
