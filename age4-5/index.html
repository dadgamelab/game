<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>4〜5さいのゲーム - とうちゃんのゲームラボ</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: #f2fbf6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }
    header {
      width: 100%;
      max-width: 360px;
      margin-bottom: 24px;
    }
    .back-btn {
      display: inline-block;
      text-decoration: none;
      background: #fff;
      color: #666;
      font-size: 0.9rem;
      padding: 6px 14px;
      border-radius: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
      margin-bottom: 12px;
    }
    h1 {
      font-size: 1.5rem;
      color: #00b894;
    }
    p {
      font-size: 0.9rem;
      color: #777;
      margin-top: 4px;
    }
    .game-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      max-width: 360px;
    }
    .game-card {
      display: flex;
      align-items: center;
      background: #fff;
      text-decoration: none;
      padding: 16px;
      border-radius: 20px;
      box-shadow: 0 4px 12px rgba(132,250,176,0.25);
      border: 2px solid #c3f7d8;
      transition: transform 0.1s ease;
    }
    .game-card:active {
      transform: scale(0.97);
    }
    .game-icon {
      font-size: 2.5rem;
      margin-right: 16px;
      background: #e8f8f0;
      width: 60px;
      height: 60px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .game-info h2 {
      font-size: 1.2rem;
      color: #333;
    }
    .game-info p {
      font-size: 0.85rem;
      color: #666;
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <header>
    <a href="../" class="back-btn">⬅ トップへもどる</a>
    <h1>🧩 4〜5さいのゲーム</h1>
    <p>すきな あそびを えらんでね！</p>
  </header>

  <main class="game-list">
    <a href="game1.html" class="game-card">
      <div class="game-icon">🔢</div>
      <div class="game-info">
        <h2>すうじタッチ！</h2>
        <p>1から じゅんばんに タッチしてね！</p>
      </div>
    </a>

    <a href="game2.html" class="game-card">
      <div class="game-icon">🐱</div>
      <div class="game-info">
        <h2>めいろあそび</h2>
        <p>ねこちゃんをおさかなにとどけよう！</p>
      </div>
    </a>
  </main>

</body>
</html>
