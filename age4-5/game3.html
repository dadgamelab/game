<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>おとあてピコピコ！ - とうちゃんのゲームラボ</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    body {
      background: #fdfaf6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px max(12px, env(safe-area-inset-bottom));
      touch-action: none;
      overflow: hidden;
    }
    header {
      width: 100%;
      max-width: 380px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .back-btn {
      text-decoration: none;
      background: #fff;
      color: #636e72;
      font-size: 0.82rem;
      padding: 5px 12px;
      border-radius: 18px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
      font-weight: 500;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .stage-badge {
      background: linear-gradient(135deg, #a55eea, #8854d0);
      color: #fff;
      font-weight: bold;
      font-size: 0.8rem;
      padding: 5px 12px;
      border-radius: 16px;
      box-shadow: 0 2px 6px rgba(165,94,234,0.3);
      white-space: nowrap;
    }
    .msg-banner {
      background: #ffffff;
      padding: 8px 18px;
      border-radius: 20px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.05);
      margin: 4px 0;
      text-align: center;
      font-weight: bold;
      font-size: 0.95rem;
      color: #2d3436;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      flex-shrink: 0;
      min-height: 38px;
    }
    .canvas-wrapper {
      background: #ffffff;
      padding: 8px;
      border-radius: 28px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    #gameCanvas {
      display: block;
      border-radius: 20px;
      background: #faf8f5;
      width: min(330px, 86vw, 44vh);
      height: min(330px, 86vw, 44vh);
      touch-action: none;
      cursor: pointer;
    }
    .bottom-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-shrink: 0;
      margin-top: 4px;
    }
    .repeat-btn {
      background: #ffffff;
      border: 2px solid #e0e7ff;
      color: #4f46e5;
      font-size: 0.88rem;
      font-weight: bold;
      padding: 8px 18px;
      border-radius: 22px;
      box-shadow: 0 2px 8px rgba(79,70,229,0.12);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.1s ease, background 0.15s ease;
      touch-action: manipulation;
    }
    .repeat-btn:active {
      transform: scale(0.93);
      background: #f5f7ff;
    }
    .repeat-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }
    /* クリアモーダル */
    .clear-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .clear-box {
      background: #ffffff;
      padding: 24px 20px;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      max-width: 310px;
      width: 88%;
    }
    .clear-emoji {
      font-size: 3.8rem;
      margin-bottom: 6px;
      animation: pop 0.4s ease-out;
    }
    @keyframes pop {
      0% { transform: scale(0.5); opacity: 0; }
      80% { transform: scale(1.15); opacity: 1; }
      100% { transform: scale(1); }
    }
    .clear-title {
      font-size: 1.35rem;
      font-weight: bold;
      color: #2d3436;
      margin-bottom: 6px;
    }
    .clear-desc {
      color: #636e72;
      font-size: 0.92rem;
      line-height: 1.5;
    }
    .next-btn {
      margin-top: 16px;
      padding: 12px 22px;
      background: linear-gradient(135deg, #a55eea, #8854d0);
      border: none;
      color: #fff;
      font-size: 1.05rem;
      font-weight: bold;
      border-radius: 22px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(165,94,234,0.35);
      width: 100%;
      touch-action: manipulation;
    }
    .next-btn:active {
      transform: scale(0.95);
    }
    .restart-link {
      display: inline-block;
      margin-top: 8px;
      font-size: 0.78rem;
      color: #94a3b8;
      text-decoration: underline;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="back-btn">⬅ メニュー</a>
    <div class="header-right">
      <div class="stage-badge" id="stageBadge">ステージ 1</div>
    </div>
  </header>

  <div class="msg-banner" id="msgBanner">
    <span>👀</span> <span id="msgText">じゅんび中...</span>
  </div>

  <div class="canvas-wrapper">
    <canvas id="gameCanvas" width="340" height="340"></canvas>
  </div>

  <div class="bottom-actions">
    <button class="repeat-btn" id="repeatBtn" onclick="requestRepeat()">
      <span>👂</span> もういっかい きく
    </button>
  </div>

  <!-- ステージクリアモーダル -->
  <div class="clear-modal" id="clearModal">
    <div class="clear-box">
      <div class="clear-emoji" id="clearEmoji">🎉</div>
      <div class="clear-title" id="clearTitle">せいかい！すごい！</div>
      <p class="clear-desc" id="clearDesc">つぎのステージへ すすもう！</p>
      <button class="next-btn" id="nextBtn" onclick="nextStage()">つぎの ステージへ！</button>
      <div><span class="restart-link" onclick="restartFromBeginning()">ステージ1からやりなおす</span></div>
    </div>
  </div>

  <script>
    let currentStage = 1;
    let sequence = [];
    let playerIndex = 0;
    let isPlayingSequence = false;
    let particles = [];
    const MAX_SEQUENCE = 7; // 最大7音（ステージ9以降）

    // 2回クリアごとに光る音が1つ増える計算（初期値: 3回、最大7回）
    // ステージ 1, 2 ➔ 3回
    // ステージ 3, 4 ➔ 4回
    // ステージ 5, 6 ➔ 5回
    // ステージ 7, 8 ➔ 6回
    // ステージ 9以降 ➔ 7回（MAX）
    function calcSequenceLength(stage) {
      return Math.min(MAX_SEQUENCE, 3 + Math.floor((stage - 1) / 2));
    }

    // 4つのパッド定義
    const pads = [
      { id: 0, label: 'あか', icon: '🍎', note: 'ド', freq: 261.63, baseColor: '#ff6b6b', highlightColor: '#ff9f9f', active: 0 },
      { id: 1, label: 'あお', icon: '🚙', note: 'レ', freq: 293.66, baseColor: '#48dbfb', highlightColor: '#8ae8ff', active: 0 },
      { id: 2, label: 'きいろ', icon: '⭐', note: 'ミ', freq: 329.63, baseColor: '#feca57', highlightColor: '#ffe599', active: 0 },
      { id: 3, label: 'みどり', icon: '🐸', note: 'ソ', freq: 392.00, baseColor: '#1dd1a1', highlightColor: '#6ef0cf', active: 0 }
    ];

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const msgBanner = document.getElementById('msgBanner');
    const msgText = document.getElementById('msgText');
    const stageBadge = document.getElementById('stageBadge');
    const repeatBtn = document.getElementById('repeatBtn');

    let audioCtx = null;
    function ensureAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playTone(freq, duration = 0.28, type = 'sine') {
      try {
        ensureAudioContext();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);

        // やさしく丸みのあるアタックとディケイ
        gain.gain.setValueAtTime(0.01, now);
        gain.gain.linearRampToValueAtTime(0.24, now + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now);
        osc.stop(now + duration);
      } catch (e) {
        console.error(e);
      }
    }

    function playClearSound() {
      try {
        ensureAudioContext();
        const now = audioCtx.currentTime;
        const chords = [523.25, 659.25, 783.99, 1046.5]; // ド・ミ・ソ・高ド
        chords.forEach((f, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(f, now + idx * 0.09);
          gain.gain.setValueAtTime(0.2, now + idx * 0.09);
          gain.gain.exponentialRampToValueAtTime(0.005, now + idx * 0.09 + 0.25);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + idx * 0.09);
          osc.stop(now + idx * 0.09 + 0.25);
        });
      } catch (e) {
        console.error(e);
      }
    }

    function playBuzzer() {
      try {
        ensureAudioContext();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(140, now);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.005, now + 0.2);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.2);
      } catch (e) {
        console.error(e);
      }
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function spawnParticles(cx, cy, color) {
      for (let i = 0; i < 14; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 3.5 + 1.5;
        particles.push({
          x: cx,
          y: cy,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1.0,
          color: color,
          size: Math.random() * 4 + 3
        });
      }
    }

    function getPadRect(index) {
      const margin = 16;
      const gap = 16;
      const size = (canvas.width - margin * 2 - gap) / 2;
      const col = index % 2;
      const row = Math.floor(index / 2);
      const x = margin + col * (size + gap);
      const y = margin + row * (size + gap);
      return { x, y, size, cx: x + size / 2, cy: y + size / 2 };
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 4つのパッドを描画
      pads.forEach((pad, i) => {
        const rect = getPadRect(i);
        const isActive = pad.active > 0.05;
        const scale = isActive ? 0.94 : 1.0;
        const r = 24;

        ctx.save();
        ctx.translate(rect.cx, rect.cy);
        ctx.scale(scale, scale);
        ctx.translate(-rect.cx, -rect.cy);

        // 発光時のグロー効果
        if (isActive) {
          ctx.shadowColor = pad.highlightColor;
          ctx.shadowBlur = 24 * pad.active;
        } else {
          ctx.shadowColor = 'rgba(0,0,0,0.08)';
          ctx.shadowBlur = 8;
          ctx.shadowOffsetY = 4;
        }

        // 背景
        roundRect(ctx, rect.x, rect.y, rect.size, rect.size, r);
        ctx.fillStyle = isActive ? pad.highlightColor : pad.baseColor;
        ctx.fill();

        // 影のリセット
        ctx.shadowColor = 'transparent';
        ctx.shadowBlur = 0;
        ctx.shadowOffsetY = 0;

        // ハイライト光沢（上部）
        ctx.save();
        ctx.beginPath();
        roundRect(ctx, rect.x + 4, rect.y + 4, rect.size - 8, rect.size * 0.45, r - 4);
        ctx.clip();
        const grad = ctx.createLinearGradient(rect.x, rect.y, rect.x, rect.y + rect.size * 0.45);
        grad.addColorStop(0, 'rgba(255,255,255,0.4)');
        grad.addColorStop(1, 'rgba(255,255,255,0.0)');
        ctx.fillStyle = grad;
        ctx.fillRect(rect.x, rect.y, rect.size, rect.size * 0.5);
        ctx.restore();

        // 絵文字アイコン
        ctx.font = `${rect.size * 0.38}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(pad.icon, rect.cx, rect.cy - rect.size * 0.1);

        // テキストラベル
        ctx.fillStyle = '#ffffff';
        ctx.font = `bold ${rect.size * 0.14}px sans-serif`;
        ctx.fillText(pad.label, rect.cx, rect.cy + rect.size * 0.28);

        ctx.restore();

        // アニメーション減衰
        if (pad.active > 0) {
          pad.active -= 0.05;
          if (pad.active < 0) pad.active = 0;
        }
      });

      // パーティクル描画
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.035;
        if (p.life <= 0) {
          particles.splice(i, 1);
          continue;
        }
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      requestAnimationFrame(draw);
    }

    function triggerPad(index, playSoundEffect = true) {
      const pad = pads[index];
      pad.active = 1.0;
      const rect = getPadRect(index);
      spawnParticles(rect.cx, rect.cy, pad.highlightColor);
      if (playSoundEffect) {
        playTone(pad.freq, 0.3);
      }
    }

    async function playSequence() {
      isPlayingSequence = true;
      repeatBtn.disabled = true;
      playerIndex = 0;
      msgText.textContent = `よーく みて きいてね！(${sequence.length}かい)`;

      await wait(600);

      for (let i = 0; i < sequence.length; i++) {
        const padIdx = sequence[i];
        triggerPad(padIdx, true);
        await wait(650);
      }

      await wait(200);
      isPlayingSequence = false;
      repeatBtn.disabled = false;
      msgText.textContent = `おなじ じゅんばんにおしてね！(1 / ${sequence.length})`;
    }

    function wait(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function initStage(stage) {
      currentStage = stage;
      const count = calcSequenceLength(stage);

      stageBadge.textContent = `ステージ ${currentStage}`;
      document.getElementById('clearModal').style.display = 'none';

      // 新しいシーケンス生成
      sequence = [];
      for (let i = 0; i < count; i++) {
        sequence.push(Math.floor(Math.random() * 4));
      }

      playSequence();
    }

    function handleInput(padIndex) {
      if (isPlayingSequence) return;

      triggerPad(padIndex, true);

      // 正解判定
      if (padIndex === sequence[playerIndex]) {
        playerIndex++;
        if (playerIndex >= sequence.length) {
          // ステージクリア！
          isPlayingSequence = true;
          repeatBtn.disabled = true;
          msgText.textContent = '🎉 クリア！すごい！';
          playClearSound();
          setTimeout(showClearModal, 400);
        } else {
          msgText.textContent = `そのちょうし！ (${playerIndex + 1} / ${sequence.length})`;
        }
      } else {
        // お手つき判定
        isPlayingSequence = true;
        repeatBtn.disabled = true;
        playBuzzer();
        msgText.textContent = 'あれれ？もういっかい きいてみよう！';

        // 0.8秒後にお手本を自動再生して再挑戦
        setTimeout(() => {
          playSequence();
        }, 900);
      }
    }

    function requestRepeat() {
      if (isPlayingSequence) return;
      playSequence();
    }

    function showClearModal() {
      const curCount = calcSequenceLength(currentStage);
      const nextCount = calcSequenceLength(currentStage + 1);
      const modal = document.getElementById('clearModal');
      const title = document.getElementById('clearTitle');
      const desc = document.getElementById('clearDesc');
      const emoji = document.getElementById('clearEmoji');

      title.textContent = `ステージ ${currentStage} クリア！`;

      if (curCount >= MAX_SEQUENCE) {
        emoji.textContent = '👑';
        desc.innerHTML = `すごすぎる！さいだいレベルの<br><strong style="color:#a55eea; font-size:1.15rem;">【${curCount}回】</strong> をおぼえられたね！<br>おとあてマスターの大天才！`;
      } else if (nextCount > curCount) {
        emoji.textContent = '⭐';
        desc.innerHTML = `2回クリア たっせい！つぎからは<br><strong style="color:#ee5253; font-size:1.15rem;">【${nextCount}回】</strong> にパワーアップ！`;
      } else {
        emoji.textContent = '🎉';
        desc.innerHTML = `おぼえるじゅんばん バッチリ！<br>あと1回クリアで レベルアップ！`;
      }

      modal.style.display = 'flex';
    }

    function nextStage() {
      initStage(currentStage + 1);
    }

    function restartFromBeginning() {
      initStage(1);
    }

    // Canvasのタップ／クリック座標判定
    function handleCanvasPointer(e) {
      if (isPlayingSequence) return;
      ensureAudioContext();

      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const x = (e.clientX - rect.left) * scaleX;
      const y = (e.clientY - rect.top) * scaleY;

      for (let i = 0; i < 4; i++) {
        const pRect = getPadRect(i);
        if (x >= pRect.x && x <= pRect.x + pRect.size &&
            y >= pRect.y && y <= pRect.y + pRect.size) {
          handleInput(i);
          break;
        }
      }
    }

    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      handleCanvasPointer(e);
    });

    // 初期化
    window.addEventListener('load', () => {
      draw();
      initStage(1);
    });
  </script>
</body>
</html>
