<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ことばパズル（ひらがなタッチ） - とうちゃんのゲームラボ</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    body {
      background: #fdfaf6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Maru Gothic ProN", sans-serif;
      min-height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px max(12px, env(safe-area-inset-bottom));
      touch-action: none;
      overflow: hidden;
    }
    header {
      width: 100%;
      max-width: 380px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .back-btn {
      text-decoration: none;
      background: #fff;
      color: #636e72;
      font-size: 0.82rem;
      padding: 5px 12px;
      border-radius: 18px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
      font-weight: 500;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .stage-badge {
      background: linear-gradient(135deg, #ff7675, #e84393);
      color: #fff;
      font-weight: bold;
      font-size: 0.8rem;
      padding: 5px 12px;
      border-radius: 16px;
      box-shadow: 0 2px 6px rgba(232,67,147,0.3);
      white-space: nowrap;
    }
    .msg-banner {
      background: #ffffff;
      padding: 8px 18px;
      border-radius: 20px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.05);
      margin: 4px 0;
      text-align: center;
      font-weight: bold;
      font-size: 0.95rem;
      color: #2d3436;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      flex-shrink: 0;
      min-height: 38px;
    }
    .canvas-wrapper {
      background: #ffffff;
      padding: 8px;
      border-radius: 28px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    #gameCanvas {
      display: block;
      border-radius: 20px;
      background: #fbf9f5;
      width: min(340px, 88vw, 50vh);
      height: min(390px, 88vw * 1.15, 57vh);
      touch-action: none;
      cursor: pointer;
    }
    .bottom-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-shrink: 0;
      margin-top: 4px;
    }
    .reset-btn {
      background: #ffffff;
      border: 2px solid #fed7d7;
      color: #e53e3e;
      font-size: 0.88rem;
      font-weight: bold;
      padding: 8px 18px;
      border-radius: 22px;
      box-shadow: 0 2px 8px rgba(229,62,62,0.12);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      touch-action: manipulation;
    }
    .reset-btn:active {
      transform: scale(0.93);
      background: #fff5f5;
    }
    /* クリアモーダル */
    .clear-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .clear-box {
      background: #ffffff;
      padding: 24px 20px;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      max-width: 310px;
      width: 88%;
    }
    .clear-emoji {
      font-size: 3.8rem;
      margin-bottom: 6px;
      animation: pop 0.4s ease-out;
    }
    @keyframes pop {
      0% { transform: scale(0.5); opacity: 0; }
      80% { transform: scale(1.15); opacity: 1; }
      100% { transform: scale(1); }
    }
    .clear-title {
      font-size: 1.35rem;
      font-weight: bold;
      color: #2d3436;
      margin-bottom: 6px;
    }
    .clear-desc {
      color: #636e72;
      font-size: 0.92rem;
      line-height: 1.5;
    }
    .next-btn {
      margin-top: 16px;
      padding: 12px 22px;
      background: linear-gradient(135deg, #ff7675, #e84393);
      border: none;
      color: #fff;
      font-size: 1.05rem;
      font-weight: bold;
      border-radius: 22px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(232,67,147,0.35);
      width: 100%;
      touch-action: manipulation;
    }
    .next-btn:active {
      transform: scale(0.95);
    }
    .restart-link {
      display: inline-block;
      margin-top: 8px;
      font-size: 0.78rem;
      color: #94a3b8;
      text-decoration: underline;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="back-btn">⬅ メニュー</a>
    <div class="header-right">
      <div class="stage-badge" id="stageBadge">ステージ 1 / 10</div>
    </div>
  </header>

  <div class="msg-banner" id="msgBanner">
    <span>💡</span> <span id="msgText">じゅんばんに もじを タッチしてね！</span>
  </div>

  <div class="canvas-wrapper">
    <canvas id="gameCanvas" width="340" height="390"></canvas>
  </div>

  <div class="bottom-actions">
    <button class="reset-btn" id="resetBtn" onclick="retryCurrentWord()">
      <span>🔄</span> やりなおす
    </button>
  </div>

  <!-- ステージクリアモーダル -->
  <div class="clear-modal" id="clearModal">
    <div class="clear-box">
      <div class="clear-emoji" id="clearEmoji">🎉</div>
      <div class="clear-title" id="clearTitle">せいかい！すごい！</div>
      <p class="clear-desc" id="clearDesc">つぎのことばに チャレンジ！</p>
      <button class="next-btn" id="nextBtn" onclick="nextStage()">つぎの ステージへ！</button>
      <div><span class="restart-link" onclick="restartFromBeginning()">ステージ1からやりなおす</span></div>
    </div>
  </div>

  <script>
    // 4〜5歳児向けの語彙データベース（10問すべて異なるイラスト）
    const WORD_DATABASE = {
      2: [
        { word: 'いぬ', emoji: '🐶', dummies: ['ね', 'う', 'み'] },
        { word: 'ねこ', emoji: '🐱', dummies: ['こ', 'さ', 'る'] },
        { word: 'にじ', emoji: '🌈', dummies: ['あ', 'み', 'そ'] },
        { word: 'うし', emoji: '🐮', dummies: ['ま', 'し', 'と'] },
        { word: 'あり', emoji: '🐜', dummies: ['は', 'り', 'か'] },
        { word: 'くま', emoji: '🐻', dummies: ['ま', 'る', 'と'] },
        { word: 'とり', emoji: '🐦', dummies: ['り', 'さ', 'ち'] },
        { word: 'ほし', emoji: '⭐', dummies: ['つ', 'き', 'ひ'] },
        { word: 'つき', emoji: '🌙', dummies: ['ほ', 'ひ', 'そ'] },
        { word: 'はな', emoji: '🌸', dummies: ['く', 'さ', 'き'] }
      ],
      3: [
        { word: 'りんご', emoji: '🍎', dummies: ['ば', 'み', 'め', 'す'] },
        { word: 'くるま', emoji: '🚗', dummies: ['ふ', 'ね', 'ひ', 'こ'] },
        { word: 'ばなな', emoji: '🍌', dummies: ['も', 'ぶ', 'ど', 'う'] },
        { word: 'すいか', emoji: '🍉', dummies: ['み', 'か', 'ん', 'め'] },
        { word: 'さかな', emoji: '🐟', dummies: ['た', 'こ', 'か', 'に'] },
        { word: 'いちご', emoji: '🍓', dummies: ['ぶ', 'ど', 'う', 'も'] },
        { word: 'きりん', emoji: '🦒', dummies: ['ぞ', 'う', 'り', 'し'] },
        { word: 'かえる', emoji: '🐸', dummies: ['む', 'し', 'と', 'り'] },
        { word: 'うさぎ', emoji: '🐰', dummies: ['い', 'ぬ', 'ね', 'こ'] },
        { word: 'ぶどう', emoji: '🍇', dummies: ['り', 'ん', 'ご', 'め'] }
      ],
      4: [
        { word: 'おにぎり', emoji: '🍙', dummies: ['ぱ', 'ん', 'め', 'し'] },
        { word: 'ひこうき', emoji: '✈️', dummies: ['ふ', 'ね', 'そ', 'ら'] },
        { word: 'たいよう', emoji: '☀️', dummies: ['ほ', 'し', 'く', 'も'] },
        { word: 'らいおん', emoji: '🦁', dummies: ['と', 'ら', 'ぱ', 'ん'] },
        { word: 'ひまわり', emoji: '🌻', dummies: ['は', 'な', 'み', 'ど'] },
        { word: 'ろけっと', emoji: '🚀', dummies: ['ほ', 'し', 'つ', 'き'] },
        { word: 'ふうせん', emoji: '🎈', dummies: ['あ', 'か', 'い', 'ろ'] },
        { word: 'ぺんぎん', emoji: '🐧', dummies: ['と', 'り', 'う', 'み'] },
        { word: 'かきごおり', emoji: '🍧', dummies: ['あ', 'め', 'ゆ', 'き'] }
      ]
    };

    const TOTAL_STAGES = 10;

    const tileColors = [
      { bg: '#ff7675', border: '#e84393', text: '#ffffff' },
      { bg: '#74b9ff', border: '#0984e3', text: '#ffffff' },
      { bg: '#55efc4', border: '#00b894', text: '#2d3436' },
      { bg: '#ffeaa7', border: '#fdcb6e', text: '#2d3436' },
      { bg: '#a29bfe', border: '#6c5ce7', text: '#ffffff' },
      { bg: '#fab1a0', border: '#e17055', text: '#ffffff' }
    ];

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const stageBadge = document.getElementById('stageBadge');
    const msgBanner = document.getElementById('msgBanner');
    const msgText = document.getElementById('msgText');

    let currentStage = 1;
    let currentWordObj = null;
    let targetWord = '';
    let targetChars = [];
    let filledChars = [];
    let tiles = [];
    let particles = [];
    let isClear = false;
    let animTime = 0;

    let wordPoolByLength = { 2: [], 3: [], 4: [] };

    // Web Audio API
    let audioCtx = null;
    function ensureAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playTone(freq, duration = 0.22, type = 'triangle') {
      try {
        ensureAudioContext();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);

        gain.gain.setValueAtTime(0.01, now);
        gain.gain.linearRampToValueAtTime(0.25, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now);
        osc.stop(now + duration);
      } catch (e) {
        console.error(e);
      }
    }

    function playWrongSound() {
      try {
        ensureAudioContext();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(160, now);

        gain.gain.setValueAtTime(0.16, now);
        gain.gain.exponentialRampToValueAtTime(0.005, now + 0.18);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now);
        osc.stop(now + 0.18);
      } catch (e) {
        console.error(e);
      }
    }

    function playClearSound() {
      try {
        ensureAudioContext();
        const now = audioCtx.currentTime;
        const chords = [523.25, 659.25, 783.99, 1046.5]; // ド・ミ・ソ・高ド
        chords.forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now + idx * 0.09);
          gain.gain.setValueAtTime(0.22, now + idx * 0.09);
          gain.gain.exponentialRampToValueAtTime(0.005, now + idx * 0.09 + 0.28);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + idx * 0.09);
          osc.stop(now + idx * 0.09 + 0.28);
        });
      } catch (e) {
        console.error(e);
      }
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function spawnParticles(cx, cy, color) {
      for (let i = 0; i < 16; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 4.0 + 1.5;
        particles.push({
          x: cx,
          y: cy,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1.0,
          color: color,
          size: Math.random() * 4 + 3
        });
      }
    }

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function initWordPools() {
      wordPoolByLength[2] = shuffleArray(WORD_DATABASE[2]);
      wordPoolByLength[3] = shuffleArray(WORD_DATABASE[3]);
      wordPoolByLength[4] = shuffleArray(WORD_DATABASE[4]);
    }

    function getStageConfig(stage) {
      if (stage <= 2) return { length: 2, dummyCount: 1 };
      if (stage <= 4) return { length: 3, dummyCount: 1 };
      if (stage <= 6) return { length: 3, dummyCount: 2 };
      if (stage <= 8) return { length: 4, dummyCount: 1 };
      return { length: 4, dummyCount: 2 };
    }

    function getSlotsInfo() {
      if (!targetChars.length) return [];
      const count = targetChars.length;
      const slotSize = Math.min(56, (canvas.width - 40 - (count - 1) * 12) / count);
      const gap = 10;
      const totalW = count * slotSize + (count - 1) * gap;
      const startX = (canvas.width - totalW) / 2;
      const y = 145;

      const slots = [];
      for (let i = 0; i < count; i++) {
        const x = startX + i * (slotSize + gap);
        slots.push({
          x: x,
          y: y,
          size: slotSize,
          cx: x + slotSize / 2,
          cy: y + slotSize / 2
        });
      }
      return slots;
    }

    function layoutTiles() {
      const count = tiles.length;
      const tileAreaY = 225;
      const areaH = canvas.height - tileAreaY - 15;

      if (count <= 3) {
        // 1行で並べる
        const size = 62;
        const gap = 16;
        const totalW = count * size + (count - 1) * gap;
        const startX = (canvas.width - totalW) / 2;
        const y = tileAreaY + (areaH - size) / 2;

        tiles.forEach((t, i) => {
          t.size = size;
          t.x = startX + i * (size + gap);
          t.y = y;
          t.cx = t.x + size / 2;
          t.cy = t.y + size / 2;
        });
      } else {
        // 2行で並べる
        const cols = count === 4 ? 2 : 3;
        const rows = Math.ceil(count / cols);
        const size = cols === 3 ? 58 : 64;
        const gapX = 14;
        const gapY = 14;

        for (let r = 0; r < rows; r++) {
          const rowItems = (r === rows - 1 && count % cols !== 0) ? count % cols : cols;
          const totalW = rowItems * size + (rowItems - 1) * gapX;
          const startX = (canvas.width - totalW) / 2;
          const y = tileAreaY + 8 + r * (size + gapY);

          for (let c = 0; c < rowItems; c++) {
            const idx = r * cols + c;
            if (idx < count) {
              const t = tiles[idx];
              t.size = size;
              t.x = startX + c * (size + gapX);
              t.y = y;
              t.cx = t.x + size / 2;
              t.cy = t.y + size / 2;
            }
          }
        }
      }
    }

    function updateInstruction() {
      const nextIdx = filledChars.length;
      if (nextIdx < targetChars.length) {
        msgText.textContent = `「${targetChars[nextIdx]}」を タッチしてね！ (${nextIdx + 1} / ${targetChars.length})`;
      } else {
        msgText.textContent = '🎉 できたー！すごい！';
      }
    }

    function initStage(stage) {
      currentStage = stage;
      isClear = false;
      filledChars = [];
      particles = [];

      stageBadge.textContent = `ステージ ${currentStage} / ${TOTAL_STAGES}`;
      document.getElementById('clearModal').style.display = 'none';

      const config = getStageConfig(stage);

      if (!wordPoolByLength[config.length] || wordPoolByLength[config.length].length === 0) {
        wordPoolByLength[config.length] = shuffleArray(WORD_DATABASE[config.length]);
      }

      currentWordObj = wordPoolByLength[config.length].pop();
      targetWord = currentWordObj.word;
      targetChars = targetWord.split('');

      const selectedDummies = [];
      const dummyPool = [...currentWordObj.dummies];
      for (let i = 0; i < config.dummyCount; i++) {
        if (dummyPool.length > 0) {
          const randIdx = Math.floor(Math.random() * dummyPool.length);
          selectedDummies.push(dummyPool.splice(randIdx, 1)[0]);
        }
      }

      const allTileChars = shuffleArray([...targetChars, ...selectedDummies]);

      tiles = allTileChars.map((char, index) => {
        const color = tileColors[index % tileColors.length];
        return {
          char: char,
          color: color,
          used: false,
          pressed: 0,
          x: 0,
          y: 0,
          size: 60,
          cx: 30,
          cy: 30
        };
      });

      layoutTiles();
      updateInstruction();
    }

    function handleTileTap(tile) {
      if (isClear || tile.used) return;

      tile.pressed = 1.0;
      ensureAudioContext();

      const nextExpectedChar = targetChars[filledChars.length];

      if (tile.char === nextExpectedChar) {
        // 正解の文字をタッチ
        playTone(440 + filledChars.length * 90, 0.22, 'triangle');

        tile.used = true;
        filledChars.push(tile.char);

        // パーティクル発生
        const slots = getSlotsInfo();
        const curSlot = slots[filledChars.length - 1];
        spawnParticles(curSlot.cx, curSlot.cy, tile.color.bg);

        if (filledChars.length === targetChars.length) {
          isClear = true;
          updateInstruction();
          playClearSound();
          setTimeout(showClearModal, 700);
        } else {
          updateInstruction();
        }
      } else {
        // お手つき（違う文字）
        playWrongSound();
        spawnParticles(tile.cx, tile.cy, '#e53e3e');
        msgText.textContent = `あれれ？ つぎは「${nextExpectedChar}」だよ！`;
      }
    }

    function retryCurrentWord() {
      if (isClear) return;
      filledChars = [];
      tiles.forEach(t => t.used = false);
      updateInstruction();
    }

    function showClearModal() {
      const curConfig = getStageConfig(currentStage);
      const nextConfig = getStageConfig(currentStage + 1);
      const modal = document.getElementById('clearModal');
      const title = document.getElementById('clearTitle');
      const desc = document.getElementById('clearDesc');
      const emoji = document.getElementById('clearEmoji');
      const nextBtn = document.getElementById('nextBtn');

      if (currentStage >= TOTAL_STAGES) {
        emoji.textContent = '👑';
        title.textContent = '全10問 かんせい！';
        desc.innerHTML = `10この ことばを ぜんぶあてたね！<br><strong style="color:#e84393; font-size:1.15rem;">【ことばパズルマスター】</strong>の大天才！🎉`;
        nextBtn.textContent = '最初からもういちど遊ぶ';
      } else {
        title.textContent = `ステージ ${currentStage} クリア！`;
        nextBtn.textContent = 'つぎの ステージへ！';

        const isLengthUp = nextConfig.length > curConfig.length;
        const isDummyUp = nextConfig.dummyCount > curConfig.dummyCount;

        if (isLengthUp) {
          emoji.textContent = '⭐';
          desc.innerHTML = `2回クリア たっせい！つぎからは<br><strong style="color:#e84393; font-size:1.15rem;">【${nextConfig.length}もじのことば】</strong>に パワーアップ！`;
        } else if (isDummyUp) {
          emoji.textContent = '🌟';
          desc.innerHTML = `2回クリア たっせい！<br>えらぶ文字が ふえて難しくなるよ！`;
        } else {
          emoji.textContent = '🎉';
          desc.innerHTML = `「${targetWord}」ばっちり完成！<br>あと1回クリアで レベルアップ！`;
        }
      }

      modal.style.display = 'flex';
    }

    function nextStage() {
      if (currentStage >= TOTAL_STAGES) {
        restartFromBeginning();
      } else {
        initStage(currentStage + 1);
      }
    }

    function restartFromBeginning() {
      initWordPools();
      initStage(1);
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      animTime += 0.05;

      // 1. お題カード描画（イラスト & やわらかな浮遊アニメーション）
      if (currentWordObj) {
        const floatY = Math.sin(animTime) * 3;
        const cardX = canvas.width / 2 - 58;
        const cardY = 16 + floatY;
        const cardSize = 116;

        ctx.save();
        ctx.shadowColor = 'rgba(0,0,0,0.06)';
        ctx.shadowBlur = 12;
        ctx.shadowOffsetY = 4;
        roundRect(ctx, cardX, cardY, cardSize, 100, 24);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.restore();

        // イラスト枠線
        roundRect(ctx, cardX, cardY, cardSize, 100, 24);
        ctx.strokeStyle = '#fff0f3';
        ctx.lineWidth = 3;
        ctx.stroke();

        // 絵文字
        ctx.font = '54px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(currentWordObj.emoji, canvas.width / 2, cardY + 50);
      }

      // 2. 文字スロット描画
      const slots = getSlotsInfo();
      slots.forEach((slot, i) => {
        const isFilled = i < filledChars.length;
        const isCurrent = i === filledChars.length && !isClear;

        ctx.save();
        roundRect(ctx, slot.x, slot.y, slot.size, slot.size, 16);

        if (isFilled) {
          ctx.fillStyle = '#ffffff';
          ctx.fill();
          ctx.strokeStyle = '#ff7675';
          ctx.lineWidth = 3;
          ctx.stroke();

          // 埋まった文字
          ctx.fillStyle = '#2d3436';
          ctx.font = `bold ${slot.size * 0.58}px sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(filledChars[i], slot.cx, slot.cy + 1);
        } else {
          ctx.fillStyle = isCurrent ? '#fff5f7' : '#f1f2f6';
          ctx.fill();
          ctx.strokeStyle = isCurrent ? '#ff7675' : '#dfe4ea';
          ctx.lineWidth = isCurrent ? 2.5 : 1.5;
          ctx.setLineDash(isCurrent ? [4, 4] : []);
          ctx.stroke();

          if (isCurrent) {
            // 現在のフォーカス表示
            ctx.fillStyle = '#ff7675';
            ctx.beginPath();
            ctx.arc(slot.cx, slot.cy, 4, 0, Math.PI * 2);
            ctx.fill();
          }
        }
        ctx.restore();
      });

      // 3. 選択肢タイル描画
      tiles.forEach(tile => {
        if (tile.used) {
          // 使用済みタイルは薄く表示
          ctx.save();
          roundRect(ctx, tile.x, tile.y, tile.size, tile.size, 18);
          ctx.fillStyle = 'rgba(230, 233, 238, 0.4)';
          ctx.fill();
          ctx.restore();
          return;
        }

        const scale = tile.pressed > 0.01 ? 0.92 : 1.0;
        ctx.save();
        ctx.translate(tile.cx, tile.cy);
        ctx.scale(scale, scale);
        ctx.translate(-tile.cx, -tile.cy);

        ctx.shadowColor = 'rgba(0,0,0,0.08)';
        ctx.shadowBlur = 8;
        ctx.shadowOffsetY = 4;

        roundRect(ctx, tile.x, tile.y, tile.size, tile.size, 18);
        ctx.fillStyle = tile.color.bg;
        ctx.fill();

        ctx.shadowColor = 'transparent';
        ctx.shadowBlur = 0;
        ctx.shadowOffsetY = 0;

        // ハイライト光沢
        ctx.save();
        roundRect(ctx, tile.x + 3, tile.y + 3, tile.size - 6, tile.size * 0.42, 14);
        ctx.clip();
        const grad = ctx.createLinearGradient(tile.x, tile.y, tile.x, tile.y + tile.size * 0.42);
        grad.addColorStop(0, 'rgba(255,255,255,0.45)');
        grad.addColorStop(1, 'rgba(255,255,255,0.0)');
        ctx.fillStyle = grad;
        ctx.fillRect(tile.x, tile.y, tile.size, tile.size * 0.5);
        ctx.restore();

        // 文字
        ctx.fillStyle = tile.color.text;
        ctx.font = `bold ${tile.size * 0.56}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(tile.char, tile.cx, tile.cy + 1);

        ctx.restore();

        if (tile.pressed > 0) {
          tile.pressed -= 0.1;
          if (tile.pressed < 0) tile.pressed = 0;
        }
      });

      // 4. パーティクル描画
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.035;
        if (p.life <= 0) {
          particles.splice(i, 1);
          continue;
        }
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      requestAnimationFrame(draw);
    }

    function handleCanvasPointer(e) {
      if (isClear) return;

      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const x = (e.clientX - rect.left) * scaleX;
      const y = (e.clientY - rect.top) * scaleY;

      for (let i = 0; i < tiles.length; i++) {
        const tile = tiles[i];
        if (tile.used) continue;
        if (x >= tile.x && x <= tile.x + tile.size &&
            y >= tile.y && y <= tile.y + tile.size) {
          handleTileTap(tile);
          break;
        }
      }
    }

    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      handleCanvasPointer(e);
    });

    window.addEventListener('load', () => {
      initWordPools();
      initStage(1);
      draw();
    });
  </script>
</body>
</html>
