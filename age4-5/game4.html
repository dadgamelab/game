<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>トイレット・ダッシュ！ - うんこをよけてゴールを目指せ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: radial-gradient(circle at center, #3d2b26 0%, #1a120f 100%);
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
      touch-action: none;
      overflow: hidden;
    }
    .game-shadow {
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6), 0 0 20px rgba(255, 170, 0, 0.2);
    }
    @keyframes pulse-gold {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 4px #ffd700); }
      50% { transform: scale(1.1); filter: drop-shadow(0 0 12px #ffa500); }
    }
    .toilet-pulse {
      animation: pulse-gold 1.2s infinite ease-in-out;
    }
    .glass-card {
      background: rgba(20, 25, 35, 0.85);
      backdrop-filter: blur(10px);
    }
  </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-center p-2 sm:p-4 text-white">

  <div class="relative w-full max-w-md h-full max-h-[760px] flex flex-col rounded-3xl overflow-hidden border-2 border-amber-600/40 game-shadow bg-sky-300">
    
    <!-- Top HUD Header -->
    <header class="w-full flex flex-col px-4 py-3 bg-slate-900/90 border-b border-amber-500/30 z-10 shadow-md">
      <div class="flex items-center justify-between text-xs sm:text-sm font-bold mb-2">
        <div class="flex items-center space-x-2">
          <span class="text-xl">🧻</span>
          <span class="text-amber-300">ペーパー: <span id="hud-paper" class="text-white text-base">0</span></span>
        </div>
        <div class="flex items-center space-x-2">
          <span class="text-slate-400">ゴールまで:</span>
          <span id="hud-remain" class="text-emerald-400 font-extrabold text-base">100m</span>
        </div>
      </div>

      <div class="w-full flex items-center space-x-2">
        <span class="text-sm">🏃</span>
        <div class="relative flex-1 h-4 bg-slate-800 rounded-full overflow-hidden border border-slate-700">
          <div id="hud-progress-bar" class="h-full bg-gradient-to-r from-amber-400 via-orange-400 to-emerald-400 transition-all duration-100 rounded-full" style="width: 0%;"></div>
        </div>
        <span class="text-lg toilet-pulse">🚽</span>
      </div>
    </header>

    <div class="relative flex-1 w-full h-full overflow-hidden bg-gradient-to-b from-sky-400 via-lime-200 to-amber-200">
      <canvas id="gameCanvas" class="w-full h-full block"></canvas>

      <!-- Start Overlay Screen -->
      <div id="screen-start" class="absolute inset-0 flex flex-col items-center justify-center p-6 glass-card z-20 transition-all">
        <div class="text-6xl mb-3 animate-bounce">🚽💨</div>
        <h1 class="text-3xl sm:text-4xl font-black tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-amber-400 via-orange-300 to-yellow-200 text-center mb-2 drop-shadow">
          トイレット・ダッシュ！
        </h1>
        <p class="text-slate-200 text-xs sm:text-sm text-center mb-4 leading-relaxed max-w-xs">
          空から大量の<span class="text-amber-400 font-bold">うんこ💩</span>が降ってきた！<br>
          華麗によけてトイレへ駆け込め！
        </p>

        <!-- 設定セレクトエリア -->
        <div class="w-full max-w-xs bg-slate-800/90 border border-amber-500/40 rounded-2xl p-3 mb-4 space-y-3 shadow-inner text-xs">
          <!-- 距離選択 -->
          <div>
            <div class="text-[11px] font-bold text-amber-300 mb-1.5 flex items-center justify-between">
              <span>🏁 ゴールまでの距離</span>
              <span id="label-selected-dist" class="text-slate-300 font-normal">ふつう (100m)</span>
            </div>
            <div class="grid grid-cols-3 gap-1.5" id="group-dist">
              <button type="button" data-dist="50" class="btn-opt px-2 py-1.5 rounded-lg border border-slate-600 bg-slate-700/80 font-bold hover:bg-slate-600 transition text-[11px]">
                50m<br><span class="text-[9px] font-normal text-slate-400">ちかい</span>
              </button>
              <button type="button" data-dist="100" class="btn-opt active px-2 py-1.5 rounded-lg border-2 border-amber-400 bg-amber-500/20 text-amber-300 font-bold transition text-[11px]">
                100m<br><span class="text-[9px] font-normal text-amber-200">ふつう</span>
              </button>
              <button type="button" data-dist="200" class="btn-opt px-2 py-1.5 rounded-lg border border-slate-600 bg-slate-700/80 font-bold hover:bg-slate-600 transition text-[11px]">
                200m<br><span class="text-[9px] font-normal text-slate-400">とおい</span>
              </button>
            </div>
          </div>

          <!-- スピード選択 -->
          <div>
            <div class="text-[11px] font-bold text-amber-300 mb-1.5 flex items-center justify-between">
              <span>⚡ ダッシュ速度</span>
              <span id="label-selected-speed" class="text-slate-300 font-normal">ふつう (1.0x)</span>
            </div>
            <div class="grid grid-cols-3 gap-1.5" id="group-speed">
              <button type="button" data-speed="0.75" class="btn-opt px-2 py-1.5 rounded-lg border border-slate-600 bg-slate-700/80 font-bold hover:bg-slate-600 transition text-[11px]">
                🐢 おそめ<br><span class="text-[9px] font-normal text-slate-400">0.75倍</span>
              </button>
              <button type="button" data-speed="1.0" class="btn-opt active px-2 py-1.5 rounded-lg border-2 border-amber-400 bg-amber-500/20 text-amber-300 font-bold transition text-[11px]">
                🏃 ふつう<br><span class="text-[9px] font-normal text-amber-200">1.0倍</span>
              </button>
              <button type="button" data-speed="1.45" class="btn-opt px-2 py-1.5 rounded-lg border border-slate-600 bg-slate-700/80 font-bold hover:bg-slate-600 transition text-[11px]">
                🚀 爆速<br><span class="text-[9px] font-normal text-slate-400">1.45倍</span>
              </button>
            </div>
          </div>
        </div>

        <button id="btn-start" class="px-8 py-3.5 rounded-full bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-400 hover:to-orange-500 text-slate-950 font-black text-lg tracking-wider shadow-lg shadow-orange-500/40 active:scale-95 transition transform">
          ダッシュ開始！
        </button>
      </div>

      <div id="screen-result" class="absolute inset-0 flex flex-col items-center justify-center p-6 glass-card z-20 hidden transition-all">
        <div id="result-icon" class="text-6xl mb-3">💩</div>
        <h2 id="result-title" class="text-3xl sm:text-4xl font-black text-center mb-2 tracking-wide">
          直撃...！
        </h2>
        <p id="result-desc" class="text-slate-300 text-xs sm:text-sm text-center mb-6 max-w-xs leading-relaxed">
          うんこに当たってしまった...
        </p>

        <div class="bg-slate-800/90 border border-slate-700 rounded-2xl p-4 mb-6 w-full max-w-xs text-center space-y-2 shadow-lg">
          <div class="flex justify-between text-xs text-slate-400 px-3">
            <span>集めたペーパー</span>
            <span id="final-paper" class="text-amber-400 font-bold text-base">0個</span>
          </div>
          <div class="flex justify-between text-xs text-slate-400 px-3 border-t border-slate-700/60 pt-2">
            <span>到達率</span>
            <span id="final-progress" class="text-emerald-400 font-bold text-base">0%</span>
          </div>
        </div>

        <div class="flex space-x-3">
          <button id="btn-change-settings" class="px-5 py-3 rounded-full bg-slate-700 hover:bg-slate-600 text-white font-bold text-xs tracking-wider transition">
            設定を変える
          </button>
          <button id="btn-retry" class="px-7 py-3 rounded-full bg-gradient-to-r from-orange-500 to-amber-600 hover:from-orange-400 hover:to-amber-500 text-slate-950 font-black text-sm tracking-wider shadow-lg shadow-amber-500/30 active:scale-95 transition transform">
            もう一度！
          </button>
        </div>
      </div>
    </div>

    <div class="w-full flex items-center justify-between px-8 py-3 bg-slate-900/95 border-t border-amber-500/20 sm:hidden">
      <button id="btn-left" class="w-20 h-14 bg-slate-800 border-2 border-amber-500/40 rounded-2xl flex items-center justify-center text-amber-300 text-2xl active:bg-amber-500/20 active:scale-90 transition select-none shadow">
        ◀
      </button>
      <span class="text-[11px] text-amber-200/60 font-bold tracking-widest uppercase">左右に移動</span>
      <button id="btn-right" class="w-20 h-14 bg-slate-800 border-2 border-amber-500/40 rounded-2xl flex items-center justify-center text-amber-300 text-2xl active:bg-amber-500/20 active:scale-90 transition select-none shadow">
        ▶
      </button>
    </div>
  </div>

  <script>
    class SoundFX {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContextClass();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playPaper() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523, now);
        osc.frequency.setValueAtTime(659, now + 0.08);
        osc.frequency.setValueAtTime(784, now + 0.16);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.28);
      }
      playHit() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(160, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.35);
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.35);
      }
      playClear() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const notes = [523.25, 659.25, 783.99, 1046.5];
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now + idx * 0.12);
          gain.gain.setValueAtTime(0.25, now + idx * 0.12);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.12 + 0.4);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + idx * 0.12);
          osc.stop(now + idx * 0.12 + 0.4);
        });
      }
    }

    const sound = new SoundFX();
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // DOM References
    const hudPaper = document.getElementById('hud-paper');
    const hudRemain = document.getElementById('hud-remain');
    const hudProgressBar = document.getElementById('hud-progress-bar');
    const screenStart = document.getElementById('screen-start');
    const screenResult = document.getElementById('screen-result');
    const resultIcon = document.getElementById('result-icon');
    const resultTitle = document.getElementById('result-title');
    const resultDesc = document.getElementById('result-desc');
    const finalPaper = document.getElementById('final-paper');
    const finalProgress = document.getElementById('final-progress');

    // 距離と速度の設定管理
    let selectedDistanceMeters = 100;
    let selectedSpeedMultiplier = 1.0;
    let totalDistanceUnits = 1000;

    let distance = 0;
    let paperCount = 0;
    let isRunning = false;
    let hazards = [];
    let papers = [];
    let particles = [];
    let roadStripeOffset = 0;
    let spawnTimer = 0;
    let paperTimer = 0;

    const basePlayerSpeed = 7;
    const player = {
      x: 200,
      y: 0,
      targetX: 200,
      size: 40,
      speed: basePlayerSpeed
    };

    // 距離選択ボタンのイベント設定
    const groupDist = document.getElementById('group-dist');
    const labelSelectedDist = document.getElementById('label-selected-dist');
    groupDist.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        groupDist.querySelectorAll('button').forEach(b => {
          b.className = 'btn-opt px-2 py-1.5 rounded-lg border border-slate-600 bg-slate-700/80 font-bold hover:bg-slate-600 transition text-[11px]';
        });
        btn.className = 'btn-opt active px-2 py-1.5 rounded-lg border-2 border-amber-400 bg-amber-500/20 text-amber-300 font-bold transition text-[11px]';
        selectedDistanceMeters = parseInt(btn.getAttribute('data-dist'), 10);
        totalDistanceUnits = selectedDistanceMeters * 10;
        const sub = selectedDistanceMeters === 50 ? 'ちかい' : selectedDistanceMeters === 100 ? 'ふつう' : 'とおい';
        labelSelectedDist.textContent = `${sub} (${selectedDistanceMeters}m)`;
        hudRemain.textContent = `${selectedDistanceMeters}m`;
      });
    });

    // スピード選択ボタンのイベント設定
    const groupSpeed = document.getElementById('group-speed');
    const labelSelectedSpeed = document.getElementById('label-selected-speed');
    groupSpeed.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        groupSpeed.querySelectorAll('button').forEach(b => {
          b.className = 'btn-opt px-2 py-1.5 rounded-lg border border-slate-600 bg-slate-700/80 font-bold hover:bg-slate-600 transition text-[11px]';
        });
        btn.className = 'btn-opt active px-2 py-1.5 rounded-lg border-2 border-amber-400 bg-amber-500/20 text-amber-300 font-bold transition text-[11px]';
        selectedSpeedMultiplier = parseFloat(btn.getAttribute('data-speed'));
        const sub = selectedSpeedMultiplier < 1 ? 'おそめ' : selectedSpeedMultiplier > 1 ? '爆速' : 'ふつう';
        labelSelectedSpeed.textContent = `${sub} (${selectedSpeedMultiplier}x)`;
      });
    });

    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
      player.y = canvas.height - 75;
      if (!isRunning) {
        player.x = canvas.width / 2;
        player.targetX = canvas.width / 2;
      }
    }
    window.addEventListener('resize', resizeCanvas);

    const keys = { left: false, right: false };
    window.addEventListener('keydown', (e) => {
      if (['ArrowLeft', 'KeyA'].includes(e.code)) keys.left = true;
      if (['ArrowRight', 'KeyD'].includes(e.code)) keys.right = true;
    });
    window.addEventListener('keyup', (e) => {
      if (['ArrowLeft', 'KeyA'].includes(e.code)) keys.left = false;
      if (['ArrowRight', 'KeyD'].includes(e.code)) keys.right = false;
    });

    let isPointerDown = false;
    function handlePointer(clientX) {
      const rect = canvas.getBoundingClientRect();
      const x = clientX - rect.left;
      player.targetX = Math.max(player.size / 2, Math.min(canvas.width - player.size / 2, x));
    }
    canvas.addEventListener('pointerdown', (e) => {
      isPointerDown = true;
      handlePointer(e.clientX);
    });
    window.addEventListener('pointermove', (e) => {
      if (isPointerDown) handlePointer(e.clientX);
    });
    window.addEventListener('pointerup', () => { isPointerDown = false; });

    // Mobile buttons
    const btnLeft = document.getElementById('btn-left');
    const btnRight = document.getElementById('btn-right');
    const setupHold = (el, key) => {
      el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; }, { passive: false });
      el.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
      el.addEventListener('mousedown', () => { keys[key] = true; });
      el.addEventListener('mouseup', () => { keys[key] = false; });
      el.addEventListener('mouseleave', () => { keys[key] = false; });
    };
    setupHold(btnLeft, 'left');
    setupHold(btnRight, 'right');

    function createSplash(x, y, color) {
      for (let i = 0; i < 18; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = Math.random() * 5 + 2;
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * spd,
          vy: Math.sin(angle) * spd,
          radius: Math.random() * 4 + 3,
          color,
          alpha: 1,
          decay: Math.random() * 0.04 + 0.02
        });
      }
    }

    function spawnPoop() {
      const roadMargin = 30;
      const x = Math.random() * (canvas.width - roadMargin * 2) + roadMargin;
      const baseSpd = (Math.random() * 2 + 4.2 + (distance / (totalDistanceUnits * 0.35))) * selectedSpeedMultiplier;
      hazards.push({
        x,
        y: -30,
        speed: baseSpd,
        size: 32,
        rot: Math.random() * 0.4 - 0.2
      });
    }

    function spawnPaper() {
      const roadMargin = 40;
      const x = Math.random() * (canvas.width - roadMargin * 2) + roadMargin;
      papers.push({
        x,
        y: -25,
        speed: 3.8 * selectedSpeedMultiplier,
        size: 28
      });
    }

    function startGame() {
      sound.init();
      totalDistanceUnits = selectedDistanceMeters * 10;
      player.speed = basePlayerSpeed * Math.min(1.3, Math.max(0.85, selectedSpeedMultiplier));
      distance = 0;
      paperCount = 0;
      hazards = [];
      papers = [];
      particles = [];
      spawnTimer = 0;
      paperTimer = 0;
      isRunning = true;
      player.x = canvas.width / 2;
      player.targetX = canvas.width / 2;
      updateHUD();
      screenStart.classList.add('hidden');
      screenResult.classList.add('hidden');
    }

    function finishGame(success) {
      isRunning = false;
      const pct = Math.min(100, Math.floor((distance / totalDistanceUnits) * 100));
      finalPaper.textContent = `${paperCount}個`;
      finalProgress.textContent = `${pct}%`;

      if (success) {
        sound.playClear();
        resultIcon.textContent = '🚽✨';
        resultTitle.textContent = 'ゴールイン！爽快！';
        resultTitle.className = 'text-3xl sm:text-4xl font-black text-center mb-2 tracking-wide text-emerald-400';
        resultDesc.innerHTML = `${selectedDistanceMeters}m の距離を駆け抜けた！<br>無事にトイレへ到達！スッキリ大成功です！🎉`;
      } else {
        sound.playHit();
        resultIcon.textContent = '💩';
        resultTitle.textContent = 'うんこ直撃...！';
        resultTitle.className = 'text-3xl sm:text-4xl font-black text-center mb-2 tracking-wide text-amber-500';
        const rem = Math.max(0, Math.ceil((totalDistanceUnits - distance) / 10));
        resultDesc.innerHTML = `あと <strong>${rem}m</strong> のところで被弾してしまった...<br>もう一度挑戦しよう！`;
      }
      screenResult.classList.remove('hidden');
    }

    function updateHUD() {
      const remainingMeters = Math.max(0, Math.ceil((totalDistanceUnits - distance) / 10));
      hudRemain.textContent = `${remainingMeters}m`;
      hudPaper.textContent = paperCount;
      const pct = Math.min(100, (distance / totalDistanceUnits) * 100);
      hudProgressBar.style.width = `${pct}%`;
    }

    // トイレマークのY座標を取得するヘルパー関数
    function getGoalToiletY() {
      const approachDistance = totalDistanceUnits * 0.15; // 残り15%から接近開始
      const startDist = totalDistanceUnits - approachDistance;
      if (distance < startDist) return -100;
      const ratio = Math.min(1.0, (distance - startDist) / approachDistance);
      // 上部(-50px)からプレイヤーの位置(player.y)まで降りてくる
      return -50 + ratio * (player.y - (-50));
    }

    function update() {
      if (!isRunning) return;

      distance += 1.8 * selectedSpeedMultiplier;
      roadStripeOffset = (roadStripeOffset + (5 * selectedSpeedMultiplier)) % 40;
      updateHUD();

      // トイレがプレイヤーの位置まで降りてきたタイミングでゴール判定
      const goalY = getGoalToiletY();
      if (goalY >= player.y || distance >= totalDistanceUnits) {
        distance = totalDistanceUnits;
        finishGame(true);
        return;
      }

      // Movement
      if (keys.left) player.targetX -= player.speed;
      if (keys.right) player.targetX += player.speed;
      player.targetX = Math.max(player.size / 2, Math.min(canvas.width - player.size / 2, player.targetX));
      player.x += (player.targetX - player.x) * 0.25;

      // Spawning with speed adjustment
      spawnTimer++;
      const currentSpawnRate = Math.max(10, Math.floor((35 - (distance / (totalDistanceUnits * 0.05))) / selectedSpeedMultiplier));
      if (spawnTimer >= currentSpawnRate) {
        spawnPoop();
        spawnTimer = 0;
      }

      paperTimer++;
      const currentPaperRate = Math.max(45, Math.floor(85 / selectedSpeedMultiplier));
      if (paperTimer >= currentPaperRate) {
        spawnPaper();
        paperTimer = 0;
      }

      // Check Hazard Collisions
      for (let i = hazards.length - 1; i >= 0; i--) {
        const h = hazards[i];
        h.y += h.speed;

        const dist = Math.hypot(player.x - h.x, player.y - h.y);
        if (dist < (player.size + h.size) / 2 - 8) {
          createSplash(h.x, h.y, '#795548');
          hazards.splice(i, 1);
          finishGame(false);
          return;
        }

        if (h.y > canvas.height + 40) hazards.splice(i, 1);
      }

      // Check Paper Collisions
      for (let i = papers.length - 1; i >= 0; i--) {
        const it = papers[i];
        it.y += it.speed;

        const dist = Math.hypot(player.x - it.x, player.y - it.y);
        if (dist < (player.size + it.size) / 2) {
          paperCount++;
          sound.playPaper();
          createSplash(it.x, it.y, '#ffffff');
          papers.splice(i, 1);
          continue;
        }

        if (it.y > canvas.height + 40) papers.splice(i, 1);
      }

      // Update Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= p.decay;
        if (p.alpha <= 0) particles.splice(i, 1);
      }
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Road background
      const roadW = Math.min(canvas.width - 24, 380);
      const roadX = (canvas.width - roadW) / 2;

      // Grass sides
      ctx.fillStyle = '#78c257';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Main Road
      ctx.fillStyle = '#e8c392';
      ctx.fillRect(roadX, 0, roadW, canvas.height);

      // Road Border Lines
      ctx.fillStyle = '#d49b6a';
      ctx.fillRect(roadX - 4, 0, 4, canvas.height);
      ctx.fillRect(roadX + roadW, 0, 4, canvas.height);

      // White moving dashes
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 4;
      ctx.setLineDash([20, 20]);
      ctx.lineDashOffset = -roadStripeOffset;
      ctx.beginPath();
      ctx.moveTo(roadX + 24, 0);
      ctx.lineTo(roadX + 24, canvas.height);
      ctx.moveTo(roadX + roadW - 24, 0);
      ctx.lineTo(roadX + roadW - 24, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      // Goal Toilet approaching visual effect
      const approachDistance = totalDistanceUnits * 0.15;
      if (distance >= totalDistanceUnits - approachDistance) {
        const goalY = getGoalToiletY();
        ctx.font = '54px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('🚽', canvas.width / 2, goalY);
        ctx.font = 'bold 16px sans-serif';
        ctx.fillStyle = '#1e293b';
        ctx.fillText('TOILET GOAL', canvas.width / 2, goalY + 36);
      }

      // Draw Items (Toilet Paper)
      ctx.font = '26px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (let it of papers) {
        ctx.fillText('🧻', it.x, it.y);
      }

      // Draw Hazards (Poop)
      ctx.font = '34px sans-serif';
      for (let h of hazards) {
        ctx.save();
        ctx.translate(h.x, h.y);
        ctx.rotate(h.rot);
        ctx.fillText('💩', 0, 0);
        ctx.restore();
      }

      // Draw Player
      if (isRunning) {
        const bounce = Math.sin(Date.now() / 80) * 4;
        ctx.font = '40px sans-serif';
        ctx.fillText('🏃', player.x, player.y + bounce);
      }

      // Draw Particles
      for (let p of particles) {
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }

    document.getElementById('btn-start').addEventListener('click', startGame);
    document.getElementById('btn-retry').addEventListener('click', startGame);
    document.getElementById('btn-change-settings').addEventListener('click', () => {
      screenResult.classList.add('hidden');
      screenStart.classList.remove('hidden');
    });

    window.onload = () => {
      resizeCanvas();
      loop();
    };
  </script>
</body>
</html>
