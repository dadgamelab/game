<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>もぐもぐご飯 - とうちゃんの知育ゲーム</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Zen Maru Gothic', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      background-color: #FFFDF7;
    }

    /* ぷるぷるアニメーション */
    @keyframes wobble {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-4deg) scale(1.02); }
      75% { transform: rotate(4deg) scale(1.02); }
    }
    .animate-wobble {
      animation: wobble 2.2s infinite ease-in-out;
    }

    /* 口のパクパクアニメーション（横幅は常時と完全同一・縦方向のみ開閉） */
    @keyframes mouthChew {
      0%, 100% {
        transform: scaleY(1);
      }
      50% {
        transform: scaleY(0.18);
      }
    }

    .animate-chew {
      animation: mouthChew 0.24s ease-in-out infinite;
      transform-origin: center top;
    }

    /* 食べ物の浮遊・変化アニメーション */
    .eating-float {
      transition: transform 0.25s cubic-bezier(0.34, 1.4, 0.64, 1), opacity 0.25s ease-out;
    }

    /* ごちそうさま時のハッピーバウンド */
    @keyframes happyBounce {
      0%, 100% { transform: translateY(0) scale(1); }
      40% { transform: translateY(-16px) scale(1.06); }
      70% { transform: translateY(4px) scale(0.98); }
    }
    .animate-happy {
      animation: happyBounce 0.8s ease-in-out infinite;
    }

    /* 紙吹雪・パーティクル */
    .particle {
      position: absolute;
      pointer-events: none;
      animation: popParticle 0.9s ease-out forwards;
    }

    @keyframes popParticle {
      0% { transform: translate(0, 0) scale(1); opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
    }
  </style>
</head>

<body class="min-h-screen flex flex-col items-center justify-center text-gray-800 antialiased p-3 sm:p-5 select-none overflow-x-hidden">

  <!-- メインコンテナ -->
  <main class="w-full max-w-sm sm:max-w-md flex flex-col items-center py-2 h-[94vh] max-h-[850px] justify-between">
    
    <!-- ヘッダー操作部（戻るボタン ＆ 動物切り替えタブ） -->
    <div class="w-full flex items-center justify-between px-1 mb-1">
      <button onclick="handleBack()" class="px-3.5 py-1.5 bg-white rounded-full text-gray-600 text-xs font-bold shadow-sm border border-gray-100 hover:bg-gray-50 active:scale-95 transition flex items-center gap-1">
        <span>⬅</span>
        <span>もどる</span>
      </button>

      <!-- 動物切り替えタブ（くま・うさぎ・カバ） -->
      <div class="flex bg-amber-100/70 p-1 rounded-2xl gap-1 text-xs font-bold">
        <button id="eat-animal-bear" onclick="changeEatAnimal('bear')" class="px-2.5 py-1 rounded-xl bg-white text-amber-900 shadow-sm transition">🐻 クマ</button>
        <button id="eat-animal-rabbit" onclick="changeEatAnimal('rabbit')" class="px-2.5 py-1 rounded-xl text-amber-800 hover:bg-white/60 transition">🐰 うさぎ</button>
        <button id="eat-animal-hippo" onclick="changeEatAnimal('hippo')" class="px-2.5 py-1 rounded-xl text-amber-800 hover:bg-white/60 transition">🦛 カバ</button>
      </div>
    </div>

    <!-- ガイドテキスト -->
    <div class="text-center my-1">
      <p id="eat-guide-text" class="text-sm sm:text-base font-black text-amber-800 tracking-wide flex items-center justify-center gap-1">
        <span>🥄</span>
        <span id="eat-guide-message">クマさんに ごはんを たべさせてね！</span>
        <span>😋</span>
      </p>
    </div>

            <!-- ちょこんとした小さい耳 -->

            <!-- 大きなカバのマズル -->

            <!-- 目（通常） -->

              <circle cx="82" cy="85" r="9" fill="#1E293B"/>
              <circle cx="79" cy="82" r="3" fill="#FFFFFF"/>
              <circle cx="158" cy="85" r="9" fill="#1E293B"/>
              <circle cx="155" cy="82" r="3" fill="#FFFFFF"/>
            </g>
            <!-- 目（笑顔） -->

              <path d="M73 88 Q82 76 91 88" stroke="#1E293B" stroke-width="6" stroke-linecap="round" fill="none"/>
              <path d="M149 88 Q158 76 167 88" stroke="#1E293B" stroke-width="6" stroke-linecap="round" fill="none"/>
            </g>
            <!-- ほっぺ -->
            <circle cx="56" cy="120" r="12" fill="#F472B6" opacity="0.6"/>
            <circle cx="184" cy="120" r="12" fill="#F472B6" opacity="0.6"/>

            <ellipse cx="98" cy="116" rx="8" ry="11" fill="#7C3AED" opacity="0.65"/>
            <ellipse cx="142" cy="116" rx="8" ry="11" fill="#7C3AED" opacity="0.65"/>

          <!-- 普段（待機時）の閉じたお口 -->

        <!-- 完食吹き出しメッセージ -->
        <div id="eat-bubble" class="hidden opacity-0 transition-all duration-300 -mt-2 px-5 py-1.5 rounded-full bg-gradient-to-r from-amber-400 to-orange-400 text-white font-black text-lg shadow-lg border-2 border-white transform scale-90 z-20">
          おいしかった〜！ごちそうさま！✨
        </div>
      </div>

      <!-- 食べ物セレクター＆スプーン操作エリア -->
      <div class="w-full flex flex-col items-center gap-2 z-10">
        
        <!-- 現在の食べ物＆食べ進みゲージ -->
        <div class="w-full max-w-[260px] bg-white/90 rounded-2xl p-2 border-2 border-amber-200 shadow-sm flex items-center justify-between">

          <div class="flex gap-1.5 mr-1">

            <div id="bite-3" class="w-6 h-3 rounded-full bg-amber-200 border border-amber-300 transition-colors"></div>

          </div>
        </div>

        <!-- 大きなスプーン＆食べ物（タップ／長押しでモグモグ） -->
        <div class="relative flex items-center justify-center my-1">
          <div id="food-interactive-btn"
               class="eating-float relative px-6 py-3 rounded-3xl bg-gradient-to-b from-white to-amber-50 border-4 border-amber-300 shadow-md active:scale-95 cursor-pointer touch-manipulation flex items-center gap-3">
            
            <div class="text-3xl">🥄</div>
            <!-- 現在の食べ物アイコン（4口でだんだん小さくなる） -->
            <div id="active-food-icon" class="text-5xl transition-transform duration-200 drop-shadow select-none">
              🍙
            </div>
            <div class="flex flex-col text-left">
              <span id="active-food-name" class="font-black text-amber-900 text-base">おにぎり</span>
              <span class="text-[10px] text-amber-700 font-bold bg-amber-100/80 px-2 py-0.5 rounded-full">おして もぐもぐ！</span>
            </div>
          </div>
        </div>

        <!-- 食べ物メニューパレット（おにぎり、プリン、りんご、バナナ、おにく） -->
        <div class="w-full flex justify-center gap-2 pt-1">
          <button onclick="selectFood('onigiri', 'おにぎり', '🍙')" class="food-opt-btn p-2 rounded-2xl bg-amber-100 border-2 border-amber-400 shadow-sm active:scale-90 text-2xl transition scale-105">🍙</button>
          <button onclick="selectFood('pudding', 'プリン', '🍮')" class="food-opt-btn p-2 rounded-2xl bg-white border border-amber-200 shadow-sm active:scale-90 text-2xl transition hover:border-amber-400">🍮</button>
          <button onclick="selectFood('apple', 'りんご', '🍎')" class="food-opt-btn p-2 rounded-2xl bg-white border border-amber-200 shadow-sm active:scale-90 text-2xl transition hover:border-amber-400">🍎</button>
          <button onclick="selectFood('banana', 'バナナ', '🍌')" class="food-opt-btn p-2 rounded-2xl bg-white border border-amber-200 shadow-sm active:scale-90 text-2xl transition hover:border-amber-400">🍌</button>
          <button onclick="selectFood('meat', 'おにく', '🍖')" class="food-opt-btn p-2 rounded-2xl bg-white border border-amber-200 shadow-sm active:scale-90 text-2xl transition hover:border-amber-400">🍖</button>
        </div>
      </div>
    </div>

    <!-- 下部ボタン：おかわり！ -->
    <div class="w-full flex justify-center py-2">
      <button onclick="resetFood(true)" class="w-full py-3.5 px-6 rounded-2xl bg-gradient-to-r from-emerald-400 to-teal-400 hover:from-emerald-500 hover:to-teal-500 text-white font-black text-lg shadow-lg active:scale-95 transition flex items-center justify-center gap-2">
        <span>🍲</span>
        <span id="eat-btn-label">おかわりをする！</span>
      </button>
    </div>
  </main>

  <script>
    // 効果音エンジン (Web Audio API: 外部音源不要・低遅延)
    const SoundEffects = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      },
      // もぐもぐ音「モグッ」「サクッ」
      playChew() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        const baseFreq = 220 + Math.random() * 50;
        osc.frequency.setValueAtTime(baseFreq, now);
        osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.5, now + 0.04);
        osc.frequency.exponentialRampToValueAtTime(80, now + 0.1);

        gain.gain.setValueAtTime(0.35, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.11);
      },
      // ごっくん音「ゴクンッ！」
      playGulp() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.exponentialRampToValueAtTime(140, now + 0.15);

        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.17);
      },
      // 切り替えタップ音
      playKnock() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.exponentialRampToValueAtTime(60, now + 0.08);

        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.09);
      },
      // キラキラ補充音
      playSparkle() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        [1200, 1500, 1800, 2400].forEach((freq, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + i * 0.04);
          gain.gain.setValueAtTime(0.12, now + i * 0.04);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.04 + 0.2);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + i * 0.04);
          osc.stop(now + i * 0.04 + 0.22);
        });
      },
      // 完食ファンファーレ
      playCheer() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51]; // C5, E5, G5, C6, E6
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now + idx * 0.08);
          gain.gain.setValueAtTime(0.35, now + idx * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.4);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + idx * 0.08);
          osc.stop(now + idx * 0.08 + 0.42);
        });
      }
    };

    // ゲーム状態
    let currentEatAnimal = 'bear'; // 'bear' | 'rabbit' | 'hippo'
    let currentFood = { id: 'onigiri', name: 'おにぎり', emoji: '🍙' };
    let eatBiteProgress = 0; // 0..4 (4口で完食)
    let isChewing = false;
    let chewInterval = null;

    // もどるボタン処理
    function handleBack() {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = './index.html';
      }
    }

    // 動物の切り替え（くま・うさぎ・カバで意匠を切り替え）
    function changeEatAnimal(animal) {
      currentEatAnimal = animal;

      // ボタンのスタイル切り替え
      ['bear', 'rabbit', 'hippo'].forEach(a => {
        const btn = document.getElementById(`eat-animal-` + a);
        if (a === animal) {
          btn.className = 'px-2.5 py-1 rounded-xl bg-white text-amber-900 shadow-sm transition';
        } else {
          btn.className = 'px-2.5 py-1 rounded-xl text-amber-800 hover:bg-white/60 transition';
        }
      });

      // SVG意匠の切り替え
      document.getElementById('svg-bear').classList.toggle('hidden', animal !== 'bear');
      document.getElementById('svg-rabbit').classList.toggle('hidden', animal !== 'rabbit');
      document.getElementById('svg-hippo').classList.toggle('hidden', animal !== 'hippo');

      // 口の配置・サイズをデフォルトの口幅と完全一致するように調整
      const mouthWrapper = document.getElementById('mouth-wrapper');
      const mouthTeeth = document.getElementById('mouth-teeth-top');
      const mouthCavity = document.getElementById('mouth-cavity');
      const mouthTongue = document.getElementById('mouth-tongue');
      const closedWrapper = document.getElementById('mouth-closed');
      const closedSvg = document.getElementById('svg-mouth-closed');
      const closedPath = document.getElementById('mouth-closed-path');

      if (animal === 'bear') {
        // クマ：デフォルトの口幅 76px
        closedWrapper.style.top = '148px';
        closedSvg.setAttribute('width', '80');
        closedSvg.setAttribute('viewBox', '0 0 80 30');
        closedPath.setAttribute('d', 'M5 8 Q22 23 40 13 Q58 23 75 8');
        closedPath.setAttribute('stroke', '#B45309');
        closedPath.setAttribute('stroke-width', '5');

        // 食事中の開いた口（横幅をデフォルトの76pxと同一に）
        mouthWrapper.style.width = '76px';
        mouthWrapper.style.height = '58px';
        mouthWrapper.style.top = '140px';
        mouthCavity.style.borderRadius = '38px 38px 45px 45px';
        mouthCavity.style.borderColor = '#B45309';
        mouthTeeth.innerHTML = `
          <div class="w-3.5 h-3 bg-white rounded-b-sm shadow-sm"></div>
          <div class="w-3.5 h-3 bg-white rounded-b-sm shadow-sm"></div>
        `;
        mouthTongue.className = 'w-14 h-8 rounded-t-full bg-[#FB7185] border-t-2 border-[#F43F5E] mb-[-3px]';
      } else if (animal === 'rabbit') {
        // うさぎ：デフォルトの口幅 64px
        closedWrapper.style.top = '154px';
        closedSvg.setAttribute('width', '70');
        closedSvg.setAttribute('viewBox', '0 0 70 28');
        closedPath.setAttribute('d', 'M5 9 Q19 22 35 14 Q51 22 65 9');
        closedPath.setAttribute('stroke', '#FB7185');
        closedPath.setAttribute('stroke-width', '4.5');

        // 食事中の開いた口（横幅をデフォルトの64pxと同一に）
        mouthWrapper.style.width = '64px';
        mouthWrapper.style.height = '52px';
        mouthWrapper.style.top = '148px';
        mouthCavity.style.borderRadius = '32px 32px 38px 38px';
        mouthCavity.style.borderColor = '#FB7185';
        mouthTeeth.innerHTML = `
          <div class="w-3.5 h-3.5 bg-white rounded-b-sm border-x border-b border-pink-200 shadow-sm"></div>
          <div class="w-3.5 h-3.5 bg-white rounded-b-sm border-x border-b border-pink-200 shadow-sm"></div>
        `;
        mouthTongue.className = 'w-12 h-7 rounded-t-full bg-[#FB7185] border-t-2 border-[#F43F5E] mb-[-3px]';
      } else if (animal === 'hippo') {
        // カバ：デフォルトの口幅 90px
        closedWrapper.style.top = '154px';
        closedSvg.setAttribute('width', '94');
        closedSvg.setAttribute('viewBox', '0 0 94 30');
        closedPath.setAttribute('d', 'M5 10 Q47 25 89 10');
        closedPath.setAttribute('stroke', '#7C3AED');
        closedPath.setAttribute('stroke-width', '5.5');

        // 食事中の開いた口（横幅をデフォルトの90pxと同一に）
        mouthWrapper.style.width = '90px';
        mouthWrapper.style.height = '62px';
        mouthWrapper.style.top = '145px';
        mouthCavity.style.borderRadius = '45px 45px 55px 55px';
        mouthCavity.style.borderColor = '#7C3AED';
        mouthTeeth.innerHTML = `
          <div class="w-4 h-3.5 bg-white rounded-b-md shadow-sm"></div>
          <div class="w-4 h-3.5 bg-white rounded-b-md shadow-sm"></div>
        `;
        mouthTongue.className = 'w-16 h-9 rounded-t-full bg-[#FB7185] border-t-2 border-[#F43F5E] mb-[-3px]';
      }

      resetFood(false);
      updateEatGuide();
      SoundEffects.playKnock();
    }

    // 食べ物選択
    function selectFood(id, name, emoji) {
      currentFood = { id, name, emoji };
      document.getElementById('active-food-icon').innerText = emoji;
      document.getElementById('active-food-name').innerText = name;

      // 食べ物パレットのアクティブ状態
      document.querySelectorAll('.food-opt-btn').forEach(b => {
        if (b.innerText === emoji) {
          b.className = 'food-opt-btn p-2 rounded-2xl bg-amber-100 border-2 border-amber-400 shadow-sm text-2xl transition scale-105';
        } else {
          b.className = 'food-opt-btn p-2 rounded-2xl bg-white border border-amber-200 shadow-sm text-2xl transition hover:border-amber-400';
        }
      });

      resetFood(false);
      updateEatGuide();
    }

    // ガイドテキスト更新
    function updateEatGuide() {
      const animalNames = { bear: 'クマさん', rabbit: 'うさぎさん', hippo: 'カバさん' };
      const guide = document.getElementById('eat-guide-message');
      if (eatBiteProgress < 4) {
        guide.innerText = `${animalNames[currentEatAnimal]}に ${currentFood.name}を たべさせてね！`;
      } else {
        guide.innerText = `ぜんぶ たべたよ！ごちそうさまでした！🎉`;
      }
    }

    // 食べ物をリセット（おかわり）
    function resetFood(playSound = true) {
      eatBiteProgress = 0;
      isChewing = false;
      clearInterval(chewInterval);

      if (playSound) {
        SoundEffects.playSparkle();
      }

      // ゲージリセット
      for (let i = 1; i <= 4; i++) {
        const bite = document.getElementById(`bite-${i}`);
        bite.className = 'w-6 h-3 rounded-full bg-amber-200 border border-amber-300 transition-colors';
      }

      // アイコンサイズリセット
      const foodIcon = document.getElementById('active-food-icon');
      foodIcon.style.transform = 'scale(1)';
      foodIcon.style.opacity = '1';

      // 口を普段の閉じた状態に戻す
      const mouthContainer = document.getElementById('mouth-container');
      mouthContainer.classList.remove('animate-chew');
      mouthContainer.style.transform = 'scaleY(1)';

      const mouthWrapper = document.getElementById('mouth-wrapper');
      mouthWrapper.classList.add('hidden');

      const mouthClosed = document.getElementById('mouth-closed');
      mouthClosed.classList.remove('hidden');

      // 目の表情を通常に戻す
      setEyesHappy(false);

      // 吹き出し非表示
      const bubble = document.getElementById('eat-bubble');
      bubble.classList.remove('opacity-100');
      bubble.classList.add('hidden', 'opacity-0');

      document.getElementById('eat-character').classList.remove('animate-happy');
      document.getElementById('eat-btn-label').innerText = 'おかわりをする！';
      updateEatGuide();
    }

    // 笑顔／通常目の切り替え
    function setEyesHappy(isHappy) {
      ['bear', 'rabbit', 'hippo'].forEach(a => {
        const norm = document.getElementById(`${a}-eyes-normal`);
        const happy = document.getElementById(`${a}-eyes-happy`);
        if (norm && happy) {
          norm.classList.toggle('hidden', isHappy);
          happy.classList.toggle('hidden', !isHappy);
        }
      });
    }

    // タッチ＆長押しイベントの設定
    function setupFoodPointerEvents() {
      const btn = document.getElementById('food-interactive-btn');

      const startEating = (e) => {
        e.preventDefault();
        if (eatBiteProgress >= 4) {
          resetFood(true);
          return;
        }
        if (isChewing) return;
        isChewing = true;

        // 普段の閉じた口を隠し、開いた口を表示してパクパク開始
        document.getElementById('mouth-closed').classList.add('hidden');
        const mouthWrapper = document.getElementById('mouth-wrapper');
        mouthWrapper.classList.remove('hidden');

        const mouthContainer = document.getElementById('mouth-container');
        mouthContainer.classList.add('animate-chew');

        // 初回のもぐもぐ
        takeSingleBite();

        // 押し続けている間、連続でもぐもぐ
        chewInterval = setInterval(() => {
          if (eatBiteProgress < 4) {
            takeSingleBite();
          } else {
            stopEating();
          }
        }, 550);
      };

      const stopEating = () => {
        if (!isChewing) return;
        isChewing = false;
        clearInterval(chewInterval);

        const mouthContainer = document.getElementById('mouth-container');
        mouthContainer.classList.remove('animate-chew');
        mouthContainer.style.transform = 'scaleY(1)';

        // もぐもぐ終了時は口を閉じる
        document.getElementById('mouth-wrapper').classList.add('hidden');
        document.getElementById('mouth-closed').classList.remove('hidden');
      };

      btn.addEventListener('pointerdown', startEating);
      btn.addEventListener('pointerup', stopEating);
      btn.addEventListener('pointerleave', stopEating);
      btn.addEventListener('pointercancel', stopEating);
    }

    // 1口食べる処理
    function takeSingleBite() {
      if (eatBiteProgress >= 4) return;

      eatBiteProgress++;
      SoundEffects.playCheew();

      // ゲージ更新
      const biteEl = document.getElementById(`bite-${eatBiteProgress}`);
      if (biteEl) {
        biteEl.className = 'w-6 h-3 rounded-full bg-emerald-400 border border-emerald-500 transition-colors shadow-sm';
      }

      // 食べ物が徐々に縮小（4口で完食）
      const foodIcon = document.getElementById('active-food-icon');
      const scaleVal = Math.max(0, 1 - eatBiteProgress * 0.25);
      foodIcon.style.transform = `scale(${scaleVal})`;

      // 一口ごとの小さなパーティクル（もぐもぐカス・星）
      const rect = document.getElementById('mouth-wrapper').getBoundingClientRect();
      spawnChewCrumbs(rect.left + rect.width / 2, rect.top + rect.height / 2);

      // 4口完食した時の演出
      if (eatBiteProgress === 4) {
        foodIcon.style.opacity = '0';
        setTimeout(() => {
          finishMeal();
        }, 300);
      }
    }

    // SoundEffects呼び出しのスペルミス耐性用エイリアス
    SoundEffects.playCheew = SoundEffects.playChew;

    // 完食ファンファーレ
    function finishMeal() {
      SoundEffects.playGulp();
      setTimeout(() => {
        SoundEffects.playCheer();
      }, 200);

      // 食べ終わったので口を閉じた状態に
      document.getElementById('mouth-wrapper').classList.add('hidden');
      document.getElementById('mouth-closed').classList.remove('hidden');

      // 目を笑顔に
      setEyesHappy(true);

      // キャラクターが嬉しそうに飛び跳ねる
      const charEl = document.getElementById('eat-character');
      charEl.classList.add('animate-happy');

      // 吹き出し表示
      const bubble = document.getElementById('eat-bubble');
      bubble.classList.remove('hidden');
      setTimeout(() => {
        bubble.classList.remove('opacity-0');
        bubble.classList.add('opacity-100');
      }, 50);

      // 画面全体に祝福パーティクル
      const rect = charEl.getBoundingClientRect();
      spawnParticles(rect.left + rect.width / 2, rect.top + rect.height / 2);

      updateEatGuide();
      document.getElementById('eat-btn-label').innerText = 'もういっぱいたべる！🍲';
    }

    // もぐもぐ中の破片エフェクト
    function spawnChewCrumbs(x, y) {
      const crumbs = ['✨', '⭐️', '💛', '🌸'];
      for (let i = 0; i < 4; i++) {
        const p = document.createElement('span');
        p.className = 'particle text-sm';
        p.innerText = crumbs[Math.floor(Math.random() * crumbs.length)];

        const angle = Math.random() * Math.PI * 2;
        const distance = 25 + Math.random() * 35;
        p.style.setProperty('--tx', `${Math.cos(angle) * distance}px`);
        p.style.setProperty('--ty', `${Math.sin(angle) * distance}px`);
        p.style.left = `${x}px`;
        p.style.top = `${y}px`;

        document.body.appendChild(p);
        setTimeout(() => p.remove(), 700);
      }
    }

    // 祝福パーティクル
    function spawnParticles(x, y) {
      const symbols = ['⭐', '✨', '🌸', '💛', '🎉', '🌟'];
      const count = 14;

      for (let i = 0; i < count; i++) {
        const particle = document.createElement('span');
        particle.className = 'particle text-2xl';
        particle.innerText = symbols[Math.floor(Math.random() * symbols.length)];

        const angle = (Math.PI * 2 / count) * i + (Math.random() * 0.4);
        const distance = 80 + Math.random() * 90;
        const tx = Math.cos(angle) * distance;
        const ty = Math.sin(angle) * distance;

        particle.style.setProperty('--tx', `${tx}px`);
        particle.style.setProperty('--ty', `${ty}px`);
        particle.style.left = `${x}px`;
        particle.style.top = `${y}px`;

        document.body.appendChild(particle);
        setTimeout(() => particle.remove(), 900);
      }
    }

    // 初期化
    window.addEventListener('DOMContentLoaded', () => {
      // ユーザーの最初のタッチでオーディオコンテキストをアクティブ化
      const unlockAudio = () => {
        SoundEffects.init();
        document.removeEventListener('pointerdown', unlockAudio);
      };
      document.addEventListener('pointerdown', unlockAudio);

      // 初期化実行
      changeEatAnimal('bear');
      selectFood('onigiri', 'おにぎり', '🍙');
      setupFoodPointerEvents();
    });
  </script>
</body>
</html>
