<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>とうちゃんのゲームラボ</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    body {
      background: #fdfaf6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: sans-serif;
      overflow: hidden;
      touch-action: manipulation;
    }
    h1 {
      color: #333;
      font-size: 1.3rem;
      margin-bottom: 16px;
    }
    .touch-area {
      width: 85vw;
      height: 65vh;
      max-width: 450px;
      background: #ffffff;
      border: 4px dashed #ddd;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      color: #aaa;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
    }
    .star {
      position: absolute;
      font-size: 3.5rem;
      pointer-events: none;
      animation: pop 0.6s ease-out forwards;
    }
    @keyframes pop {
      0% { transform: scale(0.2) translateY(0); opacity: 1; }
      100% { transform: scale(1.4) translateY(-40px); opacity: 0; }
    }
  </style>
</head>
<body>

  <h1>🌟 がめんを ぽん！ してみてね 🌟</h1>
  <div class="touch-area" id="stage">ここを タップ！</div>

  <script>
    const stage = document.getElementById('stage');
    const items = ['⭐', '🎈', '🚗', '🐱', '🍎', '🌈', '🍓', '🚀'];

    let audioCtx = null;
    function playPop() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(500 + Math.random() * 250, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.12);
    }

    stage.addEventListener('pointerdown', (e) => {
      playPop();
      const mark = document.createElement('div');
      mark.className = 'star';
      mark.textContent = items[Math.floor(Math.random() * items.length)];
      
      const rect = stage.getBoundingClientRect();
      mark.style.left = (e.clientX - rect.left - 28) + 'px';
      mark.style.top = (e.clientY - rect.top - 28) + 'px';
      
      stage.appendChild(mark);
      setTimeout(() => mark.remove(), 600);
    });
  </script>
</body>
</html>
