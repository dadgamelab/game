<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>いないいないばぁ！扉 - とうちゃんの知育ゲーム</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Zen Maru Gothic', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      background-color: #FFFDF7;
    }

    /* 扉の3Dパースペクティブ */
    .door-perspective {
      perspective: 1200px;
    }

    .door-left, .door-right {
      transition: transform 0.65s cubic-bezier(0.34, 1.56, 0.64, 1);
      transform-style: preserve-3d;
    }

    .door-left {
      transform-origin: left center;
    }
    .door-right {
      transform-origin: right center;
    }

    .door-open-left {
      transform: rotateY(-125deg);
    }
    .door-open-right {
      transform: rotateY(125deg);
    }

    /* 草むらモードのアニメーション */
    .grass-left {
      transition: transform 0.6s cubic-bezier(0.34, 1.4, 0.64, 1);
      transform-origin: bottom left;
    }
    .grass-right {
      transition: transform 0.6s cubic-bezier(0.34, 1.4, 0.64, 1);
      transform-origin: bottom right;
    }
    .grass-open-left {
      transform: translateX(-80%) rotate(-25deg);
    }
    .grass-open-right {
      transform: translateX(80%) rotate(25deg);
    }

    /* カーテンモードのアニメーション */
    .curtain-left {
      transition: transform 0.6s cubic-bezier(0.2, 0.9, 0.3, 1);
      transform-origin: left center;
    }
    .curtain-right {
      transition: transform 0.6s cubic-bezier(0.2, 0.9, 0.3, 1);
      transform-origin: right center;
    }
    .curtain-open-left {
      transform: scaleX(0.12);
    }
    .curtain-open-right {
      transform: scaleX(0.12);
    }

    /* キャラクター飛び出しバウンド */
    @keyframes popBounce {
      0% { transform: scale(0.2) translateY(50px); opacity: 0; }
      60% { transform: scale(1.15) translateY(-15px); opacity: 1; }
      80% { transform: scale(0.95) translateY(5px); }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }

    .animate-pop {
      animation: popBounce 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    /* ガイドのぷるぷるアニメーション */
    @keyframes wobble {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-4deg) scale(1.02); }
      75% { transform: rotate(4deg) scale(1.02); }
    }
    .animate-wobble {
      animation: wobble 2.2s infinite ease-in-out;
    }

    /* パーティクル */
    .particle {
      position: absolute;
      pointer-events: none;
      animation: popParticle 0.9s ease-out forwards;
    }

    @keyframes popParticle {
      0% { transform: translate(0, 0) scale(1); opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
    }
  </style>
</head>

<body class="min-h-screen flex flex-col items-center justify-center text-gray-800 antialiased p-3 sm:p-5 select-none overflow-x-hidden">

  <main class="w-full max-w-sm sm:max-w-md flex flex-col items-center py-2 h-[94vh] max-h-[850px] justify-between">
    
    <!-- ヘッダー操作部（戻るボタン & テーマ切り替えタブ） -->
    <div class="w-full flex items-center justify-between px-1 mb-2">
      <button onclick="handleBack()" class="px-3.5 py-1.5 bg-white rounded-full text-gray-600 text-xs font-bold shadow-sm border border-gray-100 hover:bg-gray-50 active:scale-95 transition flex items-center gap-1">
        <span>⬅</span>
        <span>もどる</span>
      </button>

      <!-- ステージ切り替え（とびら / 草むら / カーテン） -->
      <div class="flex bg-amber-100/70 p-1 rounded-2xl gap-1 text-xs font-bold">
        <button id="mode-house" onclick="changeTheme('house')" class="px-2.5 py-1 rounded-xl bg-white text-amber-900 shadow-sm transition">🚪 とびら</button>
        <button id="mode-grass" onclick="changeTheme('grass')" class="px-2.5 py-1 rounded-xl text-amber-800 hover:bg-white/60 transition">🌿 くさむら</button>
        <button id="mode-curtain" onclick="changeTheme('curtain')" class="px-2.5 py-1 rounded-xl text-amber-800 hover:bg-white/60 transition">🎪 カーテン</button>
      </div>
    </div>

    <!-- ガイドテキスト -->
    <div class="text-center my-1">
      <p id="game-guide-text" class="text-sm sm:text-base font-black text-amber-800 tracking-wide flex items-center justify-center gap-1">
        <span class="animate-bounce">🌟</span>
        <span id="guide-message">とびらを とんとん してみてね！</span>
        <span class="animate-bounce">🌟</span>
      </p>
    </div>

    <!-- ゲームメイン枠（点線カードUI） -->
    <div id="interactive-stage" onclick="handleStageClick(event)" class="relative w-full flex-1 bg-white rounded-3xl border-4 border-dashed border-amber-200/80 shadow-[0_15px_30px_-5px_rgba(251,191,36,0.15)] flex flex-col items-center justify-center p-3 sm:p-5 overflow-hidden cursor-pointer active:scale-[0.99] transition-transform">
      
      <!-- 背景デコレーション -->
      <div class="absolute inset-0 pointer-events-none opacity-40 flex flex-col justify-between p-4">
        <div class="flex justify-between">
          <span class="text-2xl animate-pulse">☁️</span>
          <span class="text-2xl animate-pulse" style="animation-delay: 1s;">✨</span>
        </div>
        <div class="flex justify-between">
          <span class="text-xl">🌸</span>
          <span class="text-xl">🎈</span>
        </div>
      </div>

      <!-- ==================== ステージコンテナ ==================== -->
      <div class="relative w-full max-w-[280px] h-[340px] flex items-center justify-center">

        <!-- 隠れている中身（動物・乗り物・食べ物など） -->
        <div id="secret-content" class="absolute inset-0 flex flex-col items-center justify-center z-10 select-none pointer-events-none">
          <!-- キャラクターアイコン -->
          <div id="char-icon" class="text-8xl sm:text-9xl drop-shadow-xl transform transition-transform opacity-0 scale-50">
            🐶
          </div>
          <!-- 吹き出しメッセージ -->
          <div id="char-bubble" class="opacity-0 transition-opacity duration-300 mt-3 px-5 py-2 rounded-2xl bg-gradient-to-r from-amber-400 to-orange-400 text-white font-black text-2xl shadow-lg border-2 border-white transform scale-90">
            ばぁ〜〜！✨
          </div>
          <!-- 名前ラベル -->
          <span id="char-name" class="opacity-0 font-black text-gray-700 text-lg mt-1 tracking-wider">
            いぬさん
          </span>
        </div>

        <!-- 1. 扉モード（シンプルな木目調両開き扉） -->
        <div id="theme-house" class="door-perspective absolute inset-0 z-20 flex items-center justify-center">
          <div class="relative w-full h-full rounded-3xl border-4 border-amber-600/30 flex overflow-visible bg-transparent shadow-sm">
            <!-- 左扉 -->
            <div id="door-l" class="door-left w-1/2 h-full bg-gradient-to-r from-amber-500 via-amber-400 to-amber-500 rounded-l-2xl border-r-2 border-amber-700 shadow-md flex items-center justify-end pr-3">
              <div class="w-5 h-5 rounded-full bg-yellow-200 border-2 border-amber-800 shadow flex items-center justify-center">
                <div class="w-1.5 h-1.5 rounded-full bg-amber-700"></div>
              </div>
            </div>
            <!-- 右扉 -->
            <div id="door-r" class="door-right w-1/2 h-full bg-gradient-to-l from-amber-500 via-amber-400 to-amber-500 rounded-r-2xl border-l-2 border-amber-700 shadow-md flex items-center justify-start pl-3">
              <div class="w-5 h-5 rounded-full bg-yellow-200 border-2 border-amber-800 shadow flex items-center justify-center">
                <div class="w-1.5 h-1.5 rounded-full bg-amber-700"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- 2. 草むらモード -->
        <div id="theme-grass" class="hidden absolute inset-0 z-20 flex items-end justify-center pointer-events-none">
          <div id="grass-l" class="grass-left w-3/5 h-[80%] bg-emerald-500 rounded-t-[100px] border-4 border-emerald-600 shadow-lg flex items-center justify-center text-4xl pr-4 -mr-6">
            🌿
          </div>
          <div id="grass-r" class="grass-right w-3/5 h-[85%] bg-green-500 rounded-t-[100px] border-4 border-green-600 shadow-lg flex items-center justify-center text-4xl pl-4">
            🍃
          </div>
        </div>

        <!-- 3. カーテンモード -->
        <div id="theme-curtain" class="hidden absolute inset-0 z-20 flex justify-between pointer-events-none overflow-hidden rounded-2xl border-4 border-purple-200">
          <div id="curtain-l" class="curtain-left w-1/2 h-full bg-gradient-to-r from-purple-500 to-indigo-500 border-r-4 border-purple-700 shadow-xl flex items-center justify-center text-2xl text-purple-200">
            ✦
          </div>
          <div id="curtain-r" class="curtain-right w-1/2 h-full bg-gradient-to-l from-purple-500 to-indigo-500 border-l-4 border-purple-700 shadow-xl flex items-center justify-center text-2xl text-purple-200">
            ✦
          </div>
        </div>

      </div>

      <!-- 下部操作ヒント -->
      <div id="touch-hint" class="mt-4 px-4 py-1.5 rounded-full bg-amber-50 border border-amber-200 text-amber-700 text-xs font-bold animate-wobble flex items-center gap-1.5 shadow-sm">
        <span>👆</span>
        <span id="hint-action-text">ここを タップしてね！</span>
      </div>

    </div>

    <!-- 下部ボタン：もういっかい！ -->
    <div class="w-full flex justify-center py-2">
      <button id="reset-button" onclick="resetOrNextDoor(event)" class="w-full py-3.5 px-6 rounded-2xl bg-gradient-to-r from-amber-400 to-orange-400 hover:from-amber-500 hover:to-orange-500 text-white font-black text-lg shadow-lg active:scale-95 transition flex items-center justify-center gap-2">
        <span>🔄</span>
        <span id="btn-label">もう１かい あける！</span>
      </button>
    </div>
  </main>

  <script>
    // Web Audio API による効果音エンジン（外部音声ファイル不要）
    const SoundEffects = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      },
      // ドアノック音「コンコン！」
      playKnock() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        [0, 0.12].forEach((offset, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(180 + idx * 30, now + offset);
          osc.frequency.exponentialRampToValueAtTime(40, now + offset + 0.08);

          gain.gain.setValueAtTime(0.4, now + offset);
          gain.gain.exponentialRampToValueAtTime(0.01, now + offset + 0.08);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + offset);
          osc.stop(now + offset + 0.09);
        });
      },
      // 飛び出しファンファーレ「ばぁ〜！」
      playPeekaboo() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
        notes.forEach((freq, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + i * 0.07);

          gain.gain.setValueAtTime(0.28, now + i * 0.07);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.07 + 0.35);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + i * 0.07);
          osc.stop(now + i * 0.07 + 0.36);
        });
      },
      // 閉まる音「パタン」
      playClose() {
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(240, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(60, this.ctx.currentTime + 0.12);

        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.13);
      },
      // キラキラ音
      playSparkle() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        [1200, 1500, 1800, 2400].forEach((freq, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + i * 0.04);
          gain.gain.setValueAtTime(0.12, now + i * 0.04);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.04 + 0.2);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + i * 0.04);
          osc.stop(now + i * 0.04 + 0.22);
        });
      }
    };

    // キャラクター定義
    const CHARACTERS = [
      { emoji: '🐶', name: 'いぬさん', soundText: 'わんわん！ばぁ！' },
      { emoji: '🐱', name: 'ねこさん', soundText: 'にゃ〜ん！ばぁ！' },
      { emoji: '🐰', name: 'うさぎさん', soundText: 'ぴょんぴょん！ばぁ！' },
      { emoji: '🐣', name: 'ひよこさん', soundText: 'ぴよぴよ！ばぁ！' },
      { emoji: '🦁', name: 'ライオンさん', soundText: 'がお〜〜！ばぁ！' },
      { emoji: '🐻', name: 'くまさん', soundText: 'がおん！ばぁ！' },
      { emoji: '🐼', name: 'パンダさん', soundText: 'もぐもぐ！ばぁ！' },
      { emoji: '🐸', name: 'かえるさん', soundText: 'げこげこ！ばぁ！' },
      { emoji: '🚗', name: 'くるま', soundText: 'ぶ〜〜ん！ばぁ！' },
      { emoji: '🚒', name: 'しょうぼうしゃ', soundText: 'う〜〜！ばぁ！' },
      { emoji: '🚀', name: 'ロケット', soundText: 'しゅ〜〜！ばぁ！' },
      { emoji: '🍎', name: 'りんごちゃん', soundText: 'シャキッ！ばぁ！' }
    ];

    // ゲーム状態
    let isOpen = false;
    let currentTheme = 'house'; // 'house' | 'grass' | 'curtain'
    let currentCharIndex = 0;

    // もどるボタン処理
    function handleBack() {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        // 戻る履歴がない場合のフォールバック
        window.location.href = './index.html';
      }
    }

    // テーマ切り替え
    function changeTheme(theme) {
      if (isOpen) {
        resetDoor(false);
      }
      currentTheme = theme;

      // ボタンのスタイル更新
      ['house', 'grass', 'curtain'].forEach(t => {
        const btn = document.getElementById(`mode-${t}`);
        if (t === theme) {
          btn.className = 'px-2.5 py-1 rounded-xl bg-white text-amber-900 shadow-sm transition';
        } else {
          btn.className = 'px-2.5 py-1 rounded-xl text-amber-800 hover:bg-white/60 transition';
        }
      });

      // 表示切り替え
      document.getElementById('theme-house').classList.toggle('hidden', theme !== 'house');
      document.getElementById('theme-grass').classList.toggle('hidden', theme !== 'grass');
      document.getElementById('theme-curtain').classList.toggle('hidden', theme !== 'curtain');

      updateGuideText();
      SoundEffects.playKnock();
    }

    // ガイドテキスト更新
    function updateGuideText() {
      const guide = document.getElementById('guide-message');
      const hint = document.getElementById('hint-action-text');

      if (!isOpen) {
        if (currentTheme === 'house') {
          guide.innerText = 'とびらを とんとん してね！';
        } else if (currentTheme === 'grass') {
          guide.innerText = 'くさむらを タッチしてみてね！';
        } else {
          guide.innerText = 'カーテンを タッチして あけてね！';
        }
        hint.innerText = 'ここを タップしてね！';
      } else {
        guide.innerText = 'だれが でてきたかな？✨';
        hint.innerText = 'タッチして つぎのおともだちへ！';
      }
    }

    // ステージクリック時の処理
    function handleStageClick(event) {
      if (!isOpen) {
        openDoor();
      } else {
        // 開いているときにタッチすると飛び跳ねて次のお友達へ
        SoundEffects.playSparkle();
        const charIcon = document.getElementById('char-icon');
        charIcon.classList.remove('animate-pop');
        void charIcon.offsetWidth; // リフロー強制
        charIcon.classList.add('animate-pop');

        const clickX = event.clientX || window.innerWidth / 2;
        const clickY = event.clientY || window.innerHeight / 2;
        spawnParticles(clickX, clickY);

        setTimeout(() => {
          resetOrNextDoor();
        }, 500);
      }
    }

    // 扉を開く
    function openDoor() {
      if (isOpen) return;
      isOpen = true;

      // 効果音「コンコン」→「ばぁ〜！」
      SoundEffects.playKnock();
      setTimeout(() => {
        SoundEffects.playPeekaboo();
        SoundEffects.playSparkle();
      }, 180);

      // キャラクター抽選（前回と重複しない）
      let nextIndex;
      do {
        nextIndex = Math.floor(Math.random() * CHARACTERS.length);
      } while (nextIndex === currentCharIndex && CHARACTERS.length > 1);
      currentCharIndex = nextIndex;

      const char = CHARACTERS[currentCharIndex];
      const charIcon = document.getElementById('char-icon');
      const charBubble = document.getElementById('char-bubble');
      const charName = document.getElementById('char-name');

      charIcon.innerText = char.emoji;
      charBubble.innerText = char.soundText;
      charName.innerText = char.name;

      // 各テーマのアニメーションクラス付与
      if (currentTheme === 'house') {
        document.getElementById('door-l').classList.add('door-open-left');
        document.getElementById('door-r').classList.add('door-open-right');
      } else if (currentTheme === 'grass') {
        document.getElementById('grass-l').classList.add('grass-open-left');
        document.getElementById('grass-r').classList.add('grass-open-right');
      } else if (currentTheme === 'curtain') {
        document.getElementById('curtain-l').classList.add('curtain-open-left');
        document.getElementById('curtain-r').classList.add('curtain-open-right');
      }

      // 中身の飛び出し演出
      setTimeout(() => {
        charIcon.classList.remove('opacity-0', 'scale-50');
        charIcon.classList.add('opacity-100');
        charIcon.classList.remove('animate-pop');
        void charIcon.offsetWidth;
        charIcon.classList.add('animate-pop');

        charBubble.classList.remove('opacity-0');
        charBubble.classList.add('opacity-100');
        charName.classList.remove('opacity-0');
        charName.classList.add('opacity-100');
      }, 120);

      // キラキラパーティクル
      const rect = document.getElementById('secret-content').getBoundingClientRect();
      spawnParticles(rect.left + rect.width / 2, rect.top + rect.height / 2);

      updateGuideText();
      document.getElementById('btn-label').innerText = 'つぎの おともだち！🚪';
    }

    // 扉を閉じる
    function resetDoor(playSound = true) {
      if (!isOpen) return;
      isOpen = false;

      if (playSound) {
        SoundEffects.playClose();
      }

      // ドア・仕掛けを元に戻す
      document.getElementById('door-l').classList.remove('door-open-left');
      document.getElementById('door-r').classList.remove('door-open-right');
      document.getElementById('grass-l').classList.remove('grass-open-left');
      document.getElementById('grass-r').classList.remove('grass-open-right');
      document.getElementById('curtain-l').classList.remove('curtain-open-left');
      document.getElementById('curtain-r').classList.remove('curtain-open-right');

      // キャラクターを隠す
      const charIcon = document.getElementById('char-icon');
      charIcon.classList.remove('animate-pop', 'opacity-100');
      charIcon.classList.add('opacity-0', 'scale-50');

      document.getElementById('char-bubble').classList.remove('opacity-100');
      document.getElementById('char-bubble').classList.add('opacity-0');
      document.getElementById('char-name').classList.remove('opacity-100');
      document.getElementById('char-name').classList.add('opacity-0');

      updateGuideText();
      document.getElementById('btn-label').innerText = 'もう１かい あける！';
    }

    // 下部ボタンからの制御
    function resetOrNextDoor(e) {
      if (e) e.stopPropagation();
      if (isOpen) {
        resetDoor(true);
      } else {
        openDoor();
      }
    }

    // 紙吹雪・星のパーティクル演出
    function spawnParticles(x, y) {
      const symbols = ['⭐', '✨', '🌸', '💛', '🎉', '🌟'];
      const count = 14;

      for (let i = 0; i < count; i++) {
        const particle = document.createElement('span');
        particle.className = 'particle text-2xl';
        particle.innerText = symbols[Math.floor(Math.random() * symbols.length)];

        const angle = (Math.PI * 2 / count) * i + (Math.random() * 0.4);
        const distance = 80 + Math.random() * 90;
        const tx = Math.cos(angle) * distance;
        const ty = Math.sin(angle) * distance;

        particle.style.setProperty('--tx', `${tx}px`);
        particle.style.setProperty('--ty', `${ty}px`);
        particle.style.left = `${x}px`;
        particle.style.top = `${y}px`;

        document.body.appendChild(particle);

        setTimeout(() => {
          particle.remove();
        }, 900);
      }
    }

    // 初期化（ユーザーの最初の操作でWeb Audio APIを解除）
    window.addEventListener('DOMContentLoaded', () => {
      const unlockAudio = () => {
        SoundEffects.init();
        document.removeEventListener('pointerdown', unlockAudio);
      };
      document.addEventListener('pointerdown', unlockAudio);
    });
  </script>
</body>
