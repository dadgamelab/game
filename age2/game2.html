<!-- HTML -->
<div class="door-game">
  <label class="door-box">
    <input type="checkbox">
    <div class="inside">🐶 ばぁ！</div>
    <div class="door">おうちをタッチ！</div>
  </label>
</div>

<style>
/* CSS */
.door-game {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 300px;
}
.door-box {
  position: relative;
  width: 200px;
  height: 200px;
  cursor: pointer;
  user-select: none;
}
.door-box input {
  display: none;
}
.inside {
  position: absolute;
  width: 100%;
  height: 100%;
  background-color: #fffae6;
  border: 4px solid #ffcc00;
  border-radius: 20px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 32px;
  font-weight: bold;
}
.door {
  position: absolute;
  width: 100%;
  height: 100%;
  background-color: #ff7675;
  color: white;
  border-radius: 20px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 20px;
  font-weight: bold;
  transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  transform-origin: left;
}
/* タッチ（チェック）で扉が開く */
.door-box input:checked ~ .door {
  transform: rotateY(-110deg);
}
</style>
