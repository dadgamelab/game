<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ぽんぽん風船割り - とうちゃんの知育ゲーム</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Zen Maru Gothic', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      background-color: #FFFDF7;
    }

    /* ぷるぷるアニメーション */
    @keyframes wobble {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-4deg) scale(1.02); }
      75% { transform: rotate(4deg) scale(1.02); }
    }
    .animate-wobble {
      animation: wobble 2.2s infinite ease-in-out;
    }

    /* 風船のゆらゆら浮遊アニメーション */
    @keyframes floatUpAndDown {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(3deg); }
    }

    .balloon-float-1 { animation: floatUpAndDown 2.8s ease-in-out infinite; }
    .balloon-float-2 { animation: floatUpAndDown 3.2s ease-in-out infinite 0.4s; }
    .balloon-float-3 { animation: floatUpAndDown 2.5s ease-in-out infinite 0.8s; }
    .balloon-float-4 { animation: floatUpAndDown 3.5s ease-in-out infinite 0.2s; }

    /* 風船が割れる時のアニメーション */
    @keyframes balloonPop {
      0% { transform: scale(1); opacity: 1; }
      40% { transform: scale(1.25); opacity: 0.9; }
      100% { transform: scale(0); opacity: 0; }
    }
    .animate-balloon-pop {
      animation: balloonPop 0.18s ease-out forwards;
    }

    /* 風船が新しく生まれるアニメーション */
    @keyframes balloonSpawn {
      0% { transform: scale(0) translateY(30px); opacity: 0; }
      70% { transform: scale(1.1) translateY(-5px); opacity: 1; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }
    .animate-balloon-spawn {
      animation: balloonSpawn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    /* 紙吹雪・パーティクル */
    .particle {
      position: absolute;
      pointer-events: none;
      animation: popParticle 0.9s ease-out forwards;
    }

    @keyframes popParticle {
      0% { transform: translate(0, 0) scale(1); opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
    }
  </style>
</head>

<body class="min-h-screen flex flex-col items-center justify-center text-gray-800 antialiased p-3 sm:p-5 select-none overflow-x-hidden">

  <!-- メインコンテナ -->
  <main class="w-full max-w-sm sm:max-w-md flex flex-col items-center py-2 h-[94vh] max-h-[850px] justify-between">
    
    <!-- ヘッダー操作部（戻るボタン ＆ 割った数カウント） -->
    <div class="w-full flex items-center justify-between px-1 mb-2">
      <button onclick="handleBack()" class="px-3.5 py-1.5 bg-white rounded-full text-gray-600 text-xs font-bold shadow-sm border border-gray-100 hover:bg-gray-50 active:scale-95 transition flex items-center gap-1">
        <span>⬅</span>
        <span>もどる</span>
      </button>

      <div class="flex items-center gap-1.5 bg-sky-100/80 px-3 py-1 rounded-full border border-sky-200 shadow-sm">
        <span class="text-xs font-bold text-sky-800">🎈 わったかず:</span>
        <span id="balloon-pop-counter" class="text-sm font-black text-sky-600">0</span>
      </div>
    </div>

    <!-- ガイドテキスト -->
    <div class="text-center my-1">
      <p class="text-sm sm:text-base font-black text-sky-800 tracking-wide flex items-center justify-center gap-1">
        <span class="animate-bounce">✨</span>
        <span id="balloon-guide-message">ふうせんを ポンポン してみてね！</span>
        <span class="animate-bounce">🎈</span>
      </p>
    </div>

    <!-- ゲームメイン枠（点線カードUI） -->
    <div id="balloon-stage" class="relative w-full flex-1 bg-gradient-to-b from-sky-50/50 via-white to-sky-50/40 rounded-3xl border-4 border-dashed border-sky-200 shadow-[0_15px_30px_-5px_rgba(56,189,248,0.15)] flex flex-col items-center justify-center p-3 overflow-hidden select-none">
      
      <!-- 背景の雲と星デコレーション -->
      <div class="absolute inset-0 pointer-events-none opacity-40 flex flex-col justify-between p-4">
        <div class="flex justify-between">
          <span class="text-2xl animate-pulse">☁️</span>
          <span class="text-2xl animate-pulse" style="animation-delay: 1.2s;">✨</span>
        </div>
        <div class="flex justify-around">
          <span class="text-xl">🌈</span>
          <span class="text-xl">☀️</span>
        </div>
      </div>

      <!-- 風船配置コンテナ（6スロット） -->
      <div id="balloon-container" class="relative w-full h-full min-h-[320px] flex flex-wrap items-center justify-around content-around p-2">
        <!-- JSで動的に配置 -->
      </div>

      <!-- 下部ヒント -->
      <div class="absolute bottom-2 left-1/2 -translate-x-1/2 px-4 py-1.5 rounded-full bg-white/95 border border-sky-200 text-sky-700 text-xs font-bold animate-wobble flex items-center gap-1.5 shadow-sm pointer-events-none">
        <span>👆</span>
        <span>さわると パチンッ！ときえるよ</span>
      </div>
    </div>

    <!-- 下部ボタン：ふうせんを増やす！ -->
    <div class="w-full flex justify-center py-2">
      <button onclick="resetAllBalloons(true)" class="w-full py-3.5 px-6 rounded-2xl bg-gradient-to-r from-sky-400 to-indigo-400 hover:from-sky-500 hover:to-indigo-500 text-white font-black text-lg shadow-lg active:scale-95 transition flex items-center justify-center gap-2">
        <span>🎈</span>
        <span>ふうせんを いっぱいにする！</span>
      </button>
    </div>
  </main>

  <script>
    // 効果音エンジン (Web Audio API: 外部音源不要・低遅延)
    const SoundEffects = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      },
      // 風船の破裂音「パチンッ！」「ポンッ！」
      playPop() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;

        // ピッチ上昇＆急降下の高周波ポップ音
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        const startFreq = 400 + Math.random() * 200;
        osc.frequency.setValueAtTime(startFreq, now);
        osc.frequency.exponentialRampToValueAtTime(1100 + Math.random() * 300, now + 0.03);
        osc.frequency.exponentialRampToValueAtTime(60, now + 0.09);

        gain.gain.setValueAtTime(0.6, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.11);

        // クラックノイズ（パチッという質感）
        const bufferSize = Math.floor(this.ctx.sampleRate * 0.03);
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        const noiseGain = this.ctx.createGain();
        noiseGain.gain.setValueAtTime(0.3, now);
        noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.03);
        noise.connect(noiseGain);
        noiseGain.connect(this.ctx.destination);
        noise.start(now);
      },
      // 全部割った時のファンファーレ
      playCheer() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51]; // C5, E5, G5, C6, E6
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now + idx * 0.08);
          gain.gain.setValueAtTime(0.35, now + idx * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.4);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + idx * 0.08);
          osc.stop(now + idx * 0.08 + 0.42);
        });
      },
      // キラキラ補充音
      playSparkle() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        [1200, 1500, 1800, 2400].forEach((freq, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + i * 0.04);
          gain.gain.setValueAtTime(0.12, now + i * 0.04);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.04 + 0.2);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + i * 0.04);
          osc.stop(now + i * 0.04 + 0.22);
        });
      }
    };

    // 風船のバリエーション定義
    const BALLOON_COLORS = [
      { bg: 'from-red-400 to-rose-500', border: 'border-red-600', shadow: 'shadow-rose-300', emoji: '🍓', text: 'あか' },
      { bg: 'from-sky-400 to-blue-500', border: 'border-sky-600', shadow: 'shadow-sky-300', emoji: '🐬', text: 'あお' },
      { bg: 'from-amber-300 to-yellow-400', border: 'border-amber-500', shadow: 'shadow-yellow-300', emoji: '⭐', text: 'きいろ' },
      { bg: 'from-emerald-400 to-green-500', border: 'border-emerald-600', shadow: 'shadow-emerald-300', emoji: '🍀', text: 'みどり' },
      { bg: 'from-pink-400 to-rose-400', border: 'border-pink-500', shadow: 'shadow-pink-300', emoji: '🐰', text: 'ぴんく' },
      { bg: 'from-purple-400 to-indigo-500', border: 'border-purple-600', shadow: 'shadow-purple-300', emoji: '🍇', text: 'むらさき' },
      { bg: 'from-orange-400 to-amber-500', border: 'border-orange-600', shadow: 'shadow-orange-300', emoji: '🦁', text: 'おれんじ' }
    ];

    let balloonPopCount = 0;

    // もどるボタン
    function handleBack() {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = './index.html';
      }
    }

    // カウンター更新
    function updateBalloonCounter() {
      const counter = document.getElementById('balloon-pop-counter');
      if (counter) counter.innerText = balloonPopCount;
    }

    // 全風船の再配置
    function resetAllBalloons(playSound = true) {
      if (playSound) {
        SoundEffects.playSparkle();
      }
      const container = document.getElementById('balloon-container');
      container.innerHTML = '';

      // 6個の風船をランダム選出
      const shuffledColors = [...BALLOON_COLORS].sort(() => 0.5 - Math.random()).slice(0, 6);
      shuffledColors.forEach((cfg, index) => {
        const balloonEl = createBalloonElement(cfg, index);
        container.appendChild(balloonEl);
      });

      document.getElementById('balloon-guide-message').innerText = 'ふうせんを ポンポン してみてね！';
    }

    // 風船DOM要素の生成
    function createBalloonElement(config, index) {
      const wrapper = document.createElement('div');
      wrapper.className = `balloon-item relative w-[42%] h-28 sm:h-32 m-1 flex flex-col items-center justify-center cursor-pointer select-none touch-manipulation animate-balloon-spawn balloon-float-${(index % 4) + 1}`;
      wrapper.dataset.index = index;

      wrapper.innerHTML = `
        <div class="relative w-20 h-24 sm:w-24 sm:h-28 rounded-[50%_50%_50%_50%_/_45%_45%_55%_55%] bg-gradient-to-tr ${config.bg} shadow-lg ${config.shadow} flex flex-col items-center justify-center border-2 border-white/60 active:scale-90 transition-transform">
          <div class="absolute top-2 left-3 w-4 h-6 rounded-full bg-white/40 rotate-[-25deg]"></div>
          <span class="text-3xl sm:text-4xl drop-shadow-sm select-none pointer-events-none">${config.emoji}</span>
          <div class="absolute -bottom-1.5 w-3 h-2 rounded-t-sm bg-amber-700/60"></div>
          <div class="absolute -bottom-6 w-0.5 h-5 bg-gray-400/80 rounded-full"></div>
        </div>
      `;

      const triggerPop = (e) => {
        e.preventDefault();
        e.stopPropagation();
        popSingleBalloon(wrapper, config, e);
      };

      wrapper.addEventListener('pointerdown', triggerPop);
      return wrapper;
    }

    // 風船破裂処理
    function popSingleBalloon(wrapper, config, event) {
      if (wrapper.classList.contains('is-popped')) return;
      wrapper.classList.add('is-popped');

      // 効果音「パチンッ！」
      SoundEffects.playPop();

      // カウント加算
      balloonPopCount++;
      updateBalloonCounter();

      // 弾けるアニメーション
      wrapper.classList.remove('animate-balloon-spawn', 'balloon-float-1', 'balloon-float-2', 'balloon-float-3', 'balloon-float-4');
      wrapper.classList.add('animate-balloon-pop');

      // クリック位置のパーティクル演出
      const rect = wrapper.getBoundingClientRect();
      const clickX = rect.left + rect.width / 2;
      const clickY = rect.top + rect.height / 2;
      spawnBalloonPopParticles(clickX, clickY, config.emoji);

      // ポップアップ文字
      showPopWord(clickX, clickY);

      // 1.8秒後に新しい風船として自然に復活
      setTimeout(() => {
        respawnBalloon(wrapper);
      }, 1800);

      // 残りの風船数をチェック
      checkRemainingBalloons();
    }

    // 風船の復活処理
    function respawnBalloon(wrapper) {
      if (!wrapper.parentElement) return;
      wrapper.classList.remove('is-popped', 'animate-balloon-pop');

      // 新しい色・絵柄に変化
      const newConfig = BALLOON_COLORS[Math.floor(Math.random() * BALLOON_COLORS.length)];
      const index = parseInt(wrapper.dataset.index || '0');

      wrapper.className = `balloon-item relative w-[42%] h-28 sm:h-32 m-1 flex flex-col items-center justify-center cursor-pointer select-none touch-manipulation animate-balloon-spawn balloon-float-${(index % 4) + 1}`;
      wrapper.innerHTML = `
        <div class="relative w-20 h-24 sm:w-24 sm:h-28 rounded-[50%_50%_50%_50%_/_45%_45%_55%_55%] bg-gradient-to-tr ${newConfig.bg} shadow-lg ${newConfig.shadow} flex flex-col items-center justify-center border-2 border-white/60 active:scale-90 transition-transform">
          <div class="absolute top-2 left-3 w-4 h-6 rounded-full bg-white/40 rotate-[-25deg]"></div>
          <span class="text-3xl sm:text-4xl drop-shadow-sm select-none pointer-events-none">${newConfig.emoji}</span>
          <div class="absolute -bottom-1.5 w-3 h-2 rounded-t-sm bg-amber-700/60"></div>
          <div class="absolute -bottom-6 w-0.5 h-5 bg-gray-400/80 rounded-full"></div>
        </div>
      `;
    }

    // 全て割れたかチェック
    function checkRemainingBalloons() {
      const container = document.getElementById('balloon-container');
      const alive = container.querySelectorAll('.balloon-item:not(.is-popped)');
      if (alive.length === 0) {
        setTimeout(() => {
          SoundEffects.playCheer();
          document.getElementById('balloon-guide-message').innerText = 'すごーい！ぜんぶ われたよ！🎉';
          spawnConfettiParticles(window.innerWidth / 2, window.innerHeight / 2);
        }, 200);
      }
    }

    // ポップテキストの表示
    function showPopWord(x, y) {
      const words = ['ポンッ！', 'パチンッ！', 'ばぁ！', 'きら〜ん✨'];
      const word = words[Math.floor(Math.random() * words.length)];
      const label = document.createElement('div');
      label.className = 'fixed pointer-events-none font-black text-rose-500 text-lg sm:text-xl drop-shadow-md z-50 transition-all duration-500';
      label.innerText = word;
      label.style.left = `${x - 30}px`;
      label.style.top = `${y - 20}px`;
      document.body.appendChild(label);

      requestAnimationFrame(() => {
        label.style.transform = 'translateY(-35px) scale(1.2)';
        label.style.opacity = '0';
      });

      setTimeout(() => label.remove(), 550);
    }

    // 風船破裂時の破片・紙吹雪
    function spawnBalloonPopParticles(x, y, emoji) {
      const symbols = [emoji, '💥', '✨', '🎈', '⭐', '💫'];
      const count = 10;

      for (let i = 0; i < count; i++) {
        const particle = document.createElement('span');
        particle.className = 'particle text-xl sm:text-2xl';
        particle.innerText = symbols[Math.floor(Math.random() * symbols.length)];

        const angle = (Math.PI * 2 / count) * i + (Math.random() * 0.4);
        const distance = 50 + Math.random() * 70;
        const tx = Math.cos(angle) * distance;
        const ty = Math.sin(angle) * distance;

        particle.style.setProperty('--tx', `${tx}px`);
        particle.style.setProperty('--ty', `${ty}px`);
        particle.style.left = `${x}px`;
        particle.style.top = `${y}px`;

        document.body.appendChild(particle);
        setTimeout(() => particle.remove(), 900);
      }
    }

    // 全割れ達成時の祝福パーティクル
    function spawnConfettiParticles(x, y) {
      const symbols = ['⭐', '✨', '🌸', '💛', '🎉', '🌟'];
      const count = 16;

      for (let i = 0; i < count; i++) {
        const particle = document.createElement('span');
        particle.className = 'particle text-2xl';
        particle.innerText = symbols[Math.floor(Math.random() * symbols.length)];

        const angle = (Math.PI * 2 / count) * i + (Math.random() * 0.4);
        const distance = 80 + Math.random() * 100;
        const tx = Math.cos(angle) * distance;
        const ty = Math.sin(angle) * distance;

        particle.style.setProperty('--tx', `${tx}px`);
        particle.style.setProperty('--ty', `${ty}px`);
        particle.style.left = `${x}px`;
        particle.style.top = `${y}px`;

        document.body.appendChild(particle);
        setTimeout(() => particle.remove(), 900);
      }
    }

    // 初期化
    window.addEventListener('DOMContentLoaded', () => {
      // ユーザーの初回タッチでオーディオアンロック
      const unlockAudio = () => {
        SoundEffects.init();
        document.removeEventListener('pointerdown', unlockAudio);
      };
      document.addEventListener('pointerdown', unlockAudio);

      // 風船の初期配置
      resetAllBalloons(false);
    });
  </script>
</body>
</html>
